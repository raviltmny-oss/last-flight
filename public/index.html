<title>Последний рейс</title>
<style>
[hidden]{display:none!important}
/* Layout: full-screen canvas world, HUD pinned to screen corners, modal sheets for workshop, building and repair */
:root{
  --panel:rgba(11,24,31,.86);
  --sheet:#122630;
  --paper:#f3ead6;
  --muted:#9fb1ae;
  --accent:#f29a2e;
  --ok:#7cc66d;
  --bad:#e4573f;
  --line:rgba(243,234,214,.15);
  --hp:#e0533f;--food:#e5a43b;--water:#3cb6d8;--energy:#b9d34a;
  --fd:'Russo One','Arial Black',Impact,sans-serif;
  --fb:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --dockH:60px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#0d4a66;color:var(--paper);font-family:var(--fb);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--fb);color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--fb);font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--paper)}

.lt{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:grid;gap:8px;justify-items:start}
.mini{width:206px;height:155px;border-radius:10px;border:1px solid var(--line);display:block;cursor:pointer;background:#14607f;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stats{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:7px;width:206px;backdrop-filter:blur(4px)}
.stat{display:grid;grid-template-columns:70px 1fr 28px;align-items:center;gap:8px;font-size:12px}
.stat .lab{color:var(--muted)}
.stat b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:4px;transition:width .25s linear}
.stat[data-k="hp"] i{background:var(--hp)}
.stat[data-k="food"] i{background:var(--food)}
.stat[data-k="water"] i{background:var(--water)}
.stat[data-k="energy"] i{background:var(--energy)}
.stat[data-k="warm"] i{background:#ff8a4a}
.status{display:flex;flex-wrap:wrap;gap:4px;max-width:206px}
.status:empty{display:none}
.st{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.st.bad{border-color:rgba(228,87,63,.75);color:#f6c0b4}
.st.info{color:#cfe6f5}
.st.good{border-color:rgba(124,198,109,.6);color:#cdeec4}
.stat.low .bar{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(228,87,63,.7)}}

.side{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:280px;display:grid;gap:8px;justify-items:end}
.clockbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;display:grid;gap:8px}
.clock{display:flex;justify-content:space-between;align-items:baseline}
.clock #dayLbl{font-family:var(--fd);font-size:15px;letter-spacing:.04em}
.clock #timeLbl{font-variant-numeric:tabular-nums;font-size:15px;color:var(--accent);font-weight:500}
.repmini{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.repmini i{background:var(--accent)}
.repmini b{color:var(--paper);font-weight:500;font-variant-numeric:tabular-nums}
.goal{font-size:12.5px;line-height:1.4;border-top:1px solid var(--line);padding-top:8px}
.goal::before{content:"ЦЕЛЬ";display:block;font-size:10px;letter-spacing:.14em;color:var(--accent);margin-bottom:2px;font-weight:700}
.warn{background:rgba(160,40,24,.9);border:1px solid rgba(255,140,110,.4);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.35;width:100%;box-sizing:border-box}
.toprow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:rgba(242,154,46,.6)}
.btn.icon{width:40px;justify-content:center;padding:0;font-size:16px}
.btn .s{display:none}
.btn.hint{border-color:#ffd34a;box-shadow:0 0 0 2px rgba(255,211,74,.55),0 0 16px rgba(255,211,74,.55);animation:btnHint 1.2s ease-in-out infinite}
@keyframes btnHint{50%{box-shadow:0 0 0 2px rgba(255,211,74,.9),0 0 26px rgba(255,211,74,.85)}}
#dodgeBtn{position:fixed;right:calc(108px + env(safe-area-inset-right,0px));bottom:calc(var(--dockH) + 38px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(52,128,190,.92);color:#fff;font-family:var(--fd);font-size:10px;padding:0;touch-action:none}
#dodgeBtn.cd{opacity:.45}
.bigmap{width:100%;aspect-ratio:4/3;display:block;border-radius:10px;border:1px solid var(--line);background:#14607f}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.45)}
.maphint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}

.dock{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:nowrap;justify-content:flex-start;justify-content:safe center;gap:5px;pointer-events:auto;touch-action:pan-x;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-top:4px}
.dock::-webkit-scrollbar{display:none}
.dock .slot{flex:0 0 auto}
.dock .slot{pointer-events:auto}
.slot{position:relative;width:50px;height:50px;border-radius:9px;background:var(--panel);border:1px solid var(--line);padding:0;cursor:default;display:grid;place-items:center}
.slot img{width:34px;height:34px;display:block}
.slot .n{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.slot.food{cursor:pointer;border-color:rgba(124,198,109,.45)}
.slot.food:hover{background:rgba(40,70,40,.9)}
.slot.tool .n{display:none}
.slot.tool.flask .n{display:block;font-size:11px}
.slot.tool{border-color:rgba(242,154,46,.6)}
.slot.part{border-color:rgba(160,190,210,.5)}
.slot .key{position:absolute;left:4px;top:2px;font-size:10px;color:var(--muted)}
.empty{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 14px;pointer-events:none}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH) + 22px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:rgba(11,24,31,.92);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13.5px;text-align:center;animation:tin .25s ease-out}
.toast.good{border-color:rgba(124,198,109,.6)}
.toast.bad{border-color:rgba(228,87,63,.8);background:rgba(70,18,12,.94)}
.toast.trophy{border-color:#ffd34a;background:linear-gradient(90deg,rgba(60,44,10,.95),rgba(11,24,31,.95));color:#ffe9a8}
.card.menu.wide{width:min(720px,100%)}
.newrec{margin:0;color:#ffd34a !important;font-weight:500}
.big.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
.tally.rec{grid-template-columns:repeat(3,1fr)}
.tally.rec b{font-size:20px}
.tally span{font-size:12px;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:min(46vh,420px);overflow:auto;padding-right:4px}
.ach{display:flex;gap:10px;align-items:flex-start;background:rgba(11,24,31,.7);border:1px solid var(--line);border-radius:10px;padding:9px 11px;opacity:.55}
.ach.on{opacity:1;border-color:rgba(255,211,74,.6);background:linear-gradient(135deg,rgba(80,60,14,.55),rgba(11,24,31,.8))}
.ach i{font-style:normal;font-size:18px;line-height:1;color:#ffd34a}
.ach b{display:block;font-size:13.5px;font-weight:500}
.ach span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:520px){.tally.rec{grid-template-columns:repeat(2,1fr)}}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.buildbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH) + 22px + env(safe-area-inset-bottom,0px));background:rgba(11,24,31,.94);border:1px solid rgba(242,154,46,.6);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box}
.buildbar b{font-family:var(--fd);font-weight:400;font-size:15px;letter-spacing:.03em}
.buildbar .chips{margin-top:4px}
.bbhint{font-size:12px;color:var(--muted);max-width:180px;line-height:1.35}
body.building #toasts{bottom:calc(var(--dockH) + 100px + env(safe-area-inset-bottom,0px))}

#touch #joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(242,154,46,.85)}
#actBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(var(--dockH) + 30px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(242,154,46,.92);font-family:var(--fd);font-size:11px;letter-spacing:.02em;padding:0;color:#2a1600;touch-action:none;white-space:nowrap;overflow:hidden}
#actBtn.fight{background:rgba(214,58,40,.95);color:#fff}
#actBtn:active{transform:scale(.94)}

.modal{position:fixed;inset:0;background:rgba(4,12,18,.6);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:20}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;width:min(660px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line);gap:12px}
.sheet h2{margin:0;font-family:var(--fd);font-weight:400;font-size:20px;letter-spacing:.04em;text-wrap:balance}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
#panelBody{overflow:auto;padding:12px 16px 16px;display:grid;gap:10px}
.sec{font-size:10.5px;letter-spacing:.16em;color:var(--accent);font-weight:700;margin-top:4px}
.sec small{display:block;letter-spacing:0;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}
.row.done{border-color:rgba(124,198,109,.35);background:rgba(124,198,109,.06)}
.row h3{margin:0 0 2px;font-size:15px;font-weight:700}
.row p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px 2px 3px;border-radius:20px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip img{width:20px;height:20px}
.chip.ok{border-color:rgba(124,198,109,.55);color:#cdeec4}
.chip.no{border-color:rgba(228,87,63,.55);color:#f6c0b4}
.chip.flag{padding:2px 8px}
.go{background:var(--accent);color:#2a1600;border:0;border-radius:9px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;min-width:118px}
.go:disabled{background:rgba(255,255,255,.08);color:var(--muted);cursor:not-allowed}
.go.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
.state{font-size:13px;font-weight:700;color:var(--ok);min-width:118px;text-align:center}
.takeoff{font-family:var(--fd);font-size:20px;padding:14px;width:100%;letter-spacing:.06em}
.progress{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.progress .bar{height:10px}
.progress .bar i{background:var(--accent)}
.note{font-size:14px;line-height:1.55;background:rgba(243,234,214,.06);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0}
.note em{color:var(--muted);font-style:normal;display:block;margin-top:8px;font-size:12.5px}

.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:radial-gradient(ellipse at center,rgba(6,22,30,.4),rgba(4,14,20,.85));z-index:30;overflow:auto}
.card{width:min(580px,100%);display:grid;gap:16px;text-align:left;margin:auto}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--accent);font-weight:700}
.card h1{font-family:var(--fd);font-weight:400;font-size:clamp(36px,9vw,64px);line-height:.95;margin:0;letter-spacing:.02em;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.card p{margin:0;font-size:15px;line-height:1.55;color:#dcd5c2;max-width:54ch}
.controls{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--muted);background:rgba(11,24,31,.75);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.controls span:nth-child(odd){color:var(--paper);white-space:nowrap}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.big{background:var(--accent);color:#2a1600;border:0;border-radius:10px;padding:15px 22px;font-family:var(--fd);font-size:18px;letter-spacing:.05em;cursor:pointer}
.big.alt{background:rgba(11,24,31,.8);color:var(--paper);border:1px solid var(--line)}
.big:hover{filter:brightness(1.08)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tally div{background:rgba(11,24,31,.75);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tally b{display:block;font-family:var(--fd);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.tally span{font-size:11.5px;color:var(--muted)}
/* menu */
.menu{gap:18px}
.menu .tag{font-size:16px;color:#e6dfcc;max-width:44ch}
.mlist{display:grid;gap:8px;width:min(380px,100%)}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(11,24,31,.84);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-family:var(--fd);font-size:17px;letter-spacing:.03em;color:var(--paper);cursor:pointer;backdrop-filter:blur(4px)}
.mbtn small{font-family:var(--fb);font-size:12px;color:var(--muted);letter-spacing:0;text-align:right}
.mbtn:hover{border-color:rgba(242,154,46,.75)}
.mbtn.primary{background:var(--accent);color:#2a1600;border-color:transparent}
.mbtn.primary small{color:rgba(42,22,0,.72)}
.mbtn.primary:hover{filter:brightness(1.07)}
.mbtn.danger{border-color:rgba(228,87,63,.65)}
.mbtn.danger:hover{background:rgba(110,26,16,.9)}
.foot{font-size:12.5px;color:var(--muted);margin:0}
.setrow{display:grid;gap:9px;background:rgba(11,24,31,.8);border:1px solid var(--line);border-radius:12px;padding:14px}
.setrow h3{margin:0;font-size:14px;font-weight:700}
.setrow p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--paper);font-weight:500;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#2a1600;border-color:transparent;font-weight:700}
.tips{margin:0;padding-left:18px;display:grid;gap:7px;font-size:13.5px;line-height:1.45;color:#dcd5c2}

<script>
(() => {
'use strict';

/* ================= Utilities ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rnd = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(ix, iy, s){
  let h = Math.imul(ix|0, 374761393) ^ Math.imul(iy|0, 668265263) ^ Math.imul(s|0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  const a = hash2(ix,iy,s), b = hash2(ix+1,iy,s), c = hash2(ix,iy+1,s), d = hash2(ix+1,iy+1,s);
  return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
}
function fbm(x, y, s, oct){
  oct = oct || 4;
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++){ v += amp*vnoise(x*f, y*f, s+i*17); norm += amp; amp *= 0.5; f *= 2.03; }
  return v / norm;
}
function angDiff(a, b){ let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }

/* ================= Canvas ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const lcan = document.createElement('canvas');
const lctx = lcan.getContext('2d');
let VW = 0, VH = 0, DPR = 1, ZOOM = 1;
// Graphics quality: «Высокое» keeps every effect, «Низкое» renders at device pixels 1:1 and drops the cosmetic extras
// (fish shadows, half the grass, cloud shadows, gulls, half the rain); «Авто» starts high and on a weak phone first lowers
// the resolution (2 -> 1.5 -> 1) and then drops the extras.
let DPR_CAP = 2, slowT = 0, LOWFX = false;
function applyQuality(){
  const q = SETTINGS.quality;
  DPR_CAP = q === 'low' ? 1 : 2; LOWFX = q === 'low'; slowT = 0;
  resize(); fogDirty = true;
}
function adaptQuality(raw){
  if (SETTINGS.quality !== 'auto') return;
  if (G.mode !== 'play' || G.paused || document.hidden || raw <= 0) { slowT = 0; return; }
  if (raw > 0.03) slowT += raw; else slowT = Math.max(0, slowT - raw*0.5);
  if (slowT > 3){
    slowT = 0;
    if (DPR_CAP > 1 && Math.min(2, window.devicePixelRatio || 1) > 1){ DPR_CAP = Math.max(1, DPR_CAP - 0.5); resize(); fogDirty = true; }
    else if (!LOWFX) LOWFX = true;
  }
}
function resize(){
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.max(1, Math.round(VW*DPR)); cv.height = Math.max(1, Math.round(VH*DPR));
  lcan.width = cv.width; lcan.height = cv.height;
  const m = Math.min(VW, VH);
  ZOOM = m < 560 ? 0.74 : (m < 820 ? 0.88 : 1);
}
window.addEventListener('resize', resize);
resize();

/* ================= World / terrain ================= */
// The world is 1.4x the original 3000x2250; WS scales distances tied to island size
const WS = 1.4, W = 4200, H = 3150, CX = 2100, CY = 1575, S = 3.5, IW = 1200, IH = 900;
const RW = { x1: CX - 650, x2: CX + 490, y: CY + 125, half: 44 };
const SEA = 0, SHALLOW = 1, SAND = 2, GRASS = 3, JUNGLE = 4, ROCK = 5;
const GRID = 40;

function baseHeight(x, y){
  const dx = (x-CX)/(W*0.39), dy = (y-CY)/(H*0.37);
  const d = Math.sqrt(dx*dx + dy*dy);
  const n = fbm(x*0.0021/WS, y*0.0021/WS, 11);
  return 1 - d + (n-0.5)*0.6;
}
function flatten(h, x, y){
  const rx = x < RW.x1-120 ? RW.x1-120-x : (x > RW.x2+120 ? x-(RW.x2+120) : 0);
  const ry = Math.max(0, Math.abs(y-RW.y) - (RW.half+70));
  const rd = Math.sqrt(rx*rx + ry*ry);
  return Math.max(h, 0.30 - rd/700);
}
function onRunway(x, y, pad){
  pad = pad || 0;
  return x > RW.x1-50-pad && x < RW.x2+60+pad && Math.abs(y-RW.y) < RW.half+pad;
}

const hMap = new Float32Array(IW*IH);
const tMap = new Uint8Array(IW*IH);
const tcan = document.createElement('canvas');
tcan.width = IW; tcan.height = IH;
const shore = [];

function genTerrain(){
  const tctx = tcan.getContext('2d');
  const img = tctx.createImageData(IW, IH);
  const D = img.data;
  for (let py = 0; py < IH; py++){
    for (let px = 0; px < IW; px++){
      const wx = px*S + S/2, wy = py*S + S/2;
      const i = py*IW + px;
      const h0 = baseHeight(wx, wy);
      const h = flatten(h0, wx, wy);
      hMap[i] = h;
      let t, r = 0, g = 0, b = 0, a = 255;
      const dn = vnoise(wx*0.045, wy*0.045, 5);
      const gr = hash2(px, py, 9) - 0.5;
      if (h < -0.05){ t = SEA; a = 0; }
      else if (h < 0.065){
        t = SHALLOW;
        const k = (h+0.05)/0.115;
        r = 60 + 80*k; g = 178 + 46*k; b = 190 + 22*k; a = Math.round(35 + 160*k*k);
      } else {
        const sr = 238 + (dn-0.5)*18 + gr*10, sg = 220 + (dn-0.5)*16 + gr*10, sb = 170 + (dn-0.5)*12 + gr*8;
        if (h < 0.15){
          t = SAND;
          const wet = h < 0.09 ? 1 - (h-0.065)/0.025 : 0;
          r = sr - 30*wet; g = sg - 32*wet; b = sb - 34*wet;
        } else if (onRunway(wx, wy, 0)){
          t = GRASS;
          r = 188 + (dn-0.5)*22 + gr*12; g = 162 + (dn-0.5)*18 + gr*12; b = 116 + gr*10;
          const ay = Math.abs(wy-RW.y);
          if (ay > RW.half-6){ r -= 26; g -= 26; b -= 22; }
          else if (Math.abs(ay-15) < 3){ r -= 12; g -= 12; b -= 10; }
        } else {
          const dn2 = vnoise(wx*0.012, wy*0.012, 7);
          let gR = 104 + (dn2-0.5)*42 + (dn-0.5)*14 + gr*8;
          let gG = 160 + (dn2-0.5)*28 + (dn-0.5)*16 + gr*8;
          let gB = 66 + (dn-0.5)*10 + gr*6;

function genDecor(){
  const d = mulberry32(77);
  decor = [];
  const flowers = ['#f5d24a','#f06a5c','#ffffff','#c88ce0'];
  for (let k = 0; k < 8400; k++){
    const x = d()*W, y = d()*H, t = tAt(x, y);
    if (t < SAND || onRunway(x, y, 6)) continue;
    const r = d();
    if (t === GRASS){
      if (r < 0.62) decor.push({ k:'tuft', x, y, s:0.7+d()*0.6, c: d() < 0.5 ? '#4f8f3a' : '#7bb352' });
      else if (r < 0.80) decor.push({ k:'flower', x, y, s:1, c:flowers[Math.floor(d()*flowers.length)] });
    } else if (t === SAND){
      if (r < 0.10) decor.push({ k:'shell', x, y, s:0.8+d()*0.6, a:d()*TAU, c: d()<0.5 ? '#f3e2d0' : '#e6b9a6' });
      else if (r < 0.13) decor.push({ k:'star', x, y, s:0.8+d()*0.4, a:d()*TAU, c:'#e8794a' });
    } else if (t === JUNGLE){
      if (r < 0.7) decor.push({ k:'fern', x, y, s:0.8+d()*0.6, a:d()*TAU });
    } else if (t === ROCK){
      if (r < 0.5) decor.push({ k:'pebble', x, y, s:0.7+d()*0.9 });
    }
  }
  sosStones = [];
  for (let yy = plane.y+250; yy < H-60; yy += 6){
    const x0 = plane.x+90;
    if (tAt(x0, yy) === SAND && tAt(x0+150, yy) === SAND && tAt(x0, yy+60) >= SAND && hAt(x0, yy) < 0.13){
      const Sg = [[2,0],[0,0],[0,2],[2,2],[2,4],[0,4]], Og = [[0,0],[2,0],[2,4],[0,4],[0,0]];
      [Sg, Og, Sg].forEach((L, li) => {
        const bx = x0 + li*48, by = yy;
        for (let j = 0; j < L.length-1; j++){
          const ax = bx+L[j][0]*12, ay = by+L[j][1]*12, cx2 = bx+L[j+1][0]*12, cy2 = by+L[j+1][1]*12;
          const len = Math.hypot(cx2-ax, cy2-ay), n = Math.max(1, Math.round(len/7));
          for (let q = 0; q < n; q++) sosStones.push({ x:lerp(ax,cx2,q/n)+(d()-0.5)*2, y:lerp(ay,cy2,q/n)+(d()-0.5)*2, r:2.6+d()*1.2 });
        }
        const last = L[L.length-1];
        sosStones.push({ x:bx+last[0]*12, y:by+last[1]*12, r:3 });
      });
      break;
    }
  }
}

const DAY_CHORDS = [[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
const NIGHT_SCALE = [57,60,62,64,67,69,72];
const RAID_RIFF = [45,45,48,45,43,45,50,48];
function musicMode(){
  if (G.mode === 'title' || G.mode === 'win' || G.mode === 'takeoff') return 'day';
  if (G.mode === 'dead') return 'night';
  if (G.raid && pirates.length) return 'raid';

}
function musicTick(){
  if (!AU.ctx) return;
  const ac = AU.ctx;
  try {
    if (AU.mode !== 0){ MUS.next = ac.currentTime + 0.1; return; }
    const mode = musicMode();
    if (mode !== MUS.cur){
      MUS.cur = mode; MUS.step = 0;
      MUS.droneG.gain.setTargetAtTime(mode === 'night' ? 0.05 : (mode === 'raid' ? 0.03 : 0), ac.currentTime, 1.5);
    }
    if (MUS.next < ac.currentTime) MUS.next = ac.currentTime + 0.05;
    while (MUS.next < ac.currentTime + 0.35){
      const t = MUS.next, s = MUS.step;
      let dur;
      if (mode === 'day'){
        dur = 0.28;
        const ch = DAY_CHORDS[Math.floor(s/16) % 4];
        const pat = [0,2,1,3,2,1,3,2];
        if (s % 16 !== 15) mnote('triangle', ch[pat[s % 8]] + 12, t, 0.55, 0.08);
        if (s % 8 === 0) mnote('sine', ch[0] - 12, t, 1.8, 0.13, 0.03);
        if (s % 2 === 1) mhat(t, 0.02);
      } else if (mode === 'night'){

      } else {
        dur = 0.2;

/* ================= Map ================= */
const FG = 50, FW = Math.ceil(W/FG), FH = Math.ceil(H/FG);
const EXP = new Uint8Array(FW*FH);
const fogCan = document.createElement('canvas'); fogCan.width = FW; fogCan.height = FH;
const fogCtx = fogCan.getContext('2d');
let fogDirty = true, miniT = 0, landCells = 1;
function explore(x, y, r){
  const i0 = Math.max(0, Math.floor((x-r)/FG)), i1 = Math.min(FW-1, Math.floor((x+r)/FG));
  const j0 = Math.max(0, Math.floor((y-r)/FG)), j1 = Math.min(FH-1, Math.floor((y+r)/FG));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){
    const cx = i*FG + FG/2, cy = j*FG + FG/2;
    if ((cx-x)*(cx-x) + (cy-y)*(cy-y) <= r*r){ const k = j*FW + i; if (!EXP[k]){ EXP[k] = 1; fogDirty = true; } }
  }
}
function countLand(){
  let n = 0;
  for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) if (walkable(i*FG + FG/2, j*FG + FG/2)) n++;
  landCells = Math.max(1, n);
}
function exploredPct(){
  let n = 0;
  for (let j = 0; j < FH; j++) for (let i = 0; i < FW; i++) if (EXP[j*FW + i] && walkable(i*FG + FG/2, j*FG + FG/2)) n++;
  return Math.min(100, Math.round(n/landCells*100));
}
function refreshFog(){
  if (!fogDirty) return;
  const img = fogCtx.createImageData(FW, FH), d = img.data;
  for (let k = 0; k < FW*FH; k++){ const o = k*4; d[o] = 10; d[o+1] = 20; d[o+2] = 28; d[o+3] = EXP[k] ? 0 : 210; }
  fogCtx.putImageData(img, 0, 0);
  fogDirty = false;
}
function expEncode(){
  let s = '';
  for (let k = 0; k < EXP.length; k += 6){ let v = 0; for (let b = 0; b < 6; b++) if (EXP[k+b]) v |= 1 << b; s += String.fromCharCode(48 + v); }
  return s;
}
function expDecode(s){
  EXP.fill(0); fogDirty = true;
  if (typeof s !== 'string') return;
  for (let c = 0; c < s.length; c++){
    const v = s.charCodeAt(c) - 48;
    if (v < 0 || v > 63) continue;
    for (let b = 0; b < 6; b++){ const k = c*6 + b; if (k < EXP.length && ((v >> b) & 1)) EXP[k] = 1; }
  }
}
function seenAt(x, y){ const i = Math.floor(x/FG), j = Math.floor(y/FG); return i >= 0 && j >= 0 && i < FW && j < FH && EXP[j*FW + i] === 1; }
function drawMap(c, w, h, big){
  const sx = w/W, sy = h/H, k = big ? 1.7 : 1;
  const P = (x, y) => [x*sx, y*sy];
  const dot = (x, y, r, col, stroke) => { const q = P(x, y); c.fillStyle = col; c.beginPath(); c.arc(q[0], q[1], r, 0, TAU); c.fill(); if (stroke){ c.strokeStyle = stroke; c.lineWidth = 1; c.stroke(); } };
  c.save();
  c.fillStyle = '#14607f'; c.fillRect(0, 0, w, h);
  c.imageSmoothingEnabled = true;
  c.drawImage(tcan, 0, 0, w, h);
  refreshFog();
  c.drawImage(fogCan, 0, 0, w, h);
  { const a = P(RW.x1 - 50, RW.y - RW.half); c.fillStyle = 'rgba(214,186,132,.95)'; c.fillRect(a[0], a[1], (RW.x2 - RW.x1 + 110)*sx, Math.max(2, RW.half*2*sy)); }
  for (const o of objects){
    if (!o.alive) continue;
    switch (o.type){
      case 'spring': if (seenAt(o.x, o.y)) dot(o.x, o.y, 3.2*k, '#5fd0f0', '#0b3a4a'); break;
      case 'fuel': if (seenAt(o.x, o.y)) dot(o.x, o.y, 2.8*k, '#e4573f', '#3a0d08'); break;
      case 'wreck': if (seenAt(o.x, o.y)) dot(o.x, o.y, 3*k, '#d98a45', '#3a2210'); break;
      case 'boulder': dot(o.x, o.y, 2*k, '#8d877c'); break;
      case 'wall': { const a = P(o.x - 20, o.y - 20); c.fillStyle = '#8b6439'; c.fillRect(a[0], a[1], Math.max(1.5, 40*sx), Math.max(1.5, 40*sy)); break; }
      case 'cannon': dot(o.x, o.y, 2.4*k, '#2d2f31', '#c9a66b'); break;
      case 'torch': dot(o.x, o.y, 1.8*k, '#ffc64a'); break;
      case 'campfire': dot(o.x, o.y, 3*k, '#ff8a2a', '#3a1a05'); break;
      case 'workbench': { const a = P(o.x, o.y); c.fillStyle = '#c79a5e'; c.fillRect(a[0] - 2.5*k, a[1] - 2*k, 5*k, 4*k); c.strokeStyle = '#3a2210'; c.lineWidth = 1; c.strokeRect(a[0] - 2.5*k, a[1] - 2*k, 5*k, 4*k); break; }
    }
  }
  { const a = P(plane.x, plane.y); c.save(); c.translate(a[0], a[1]); c.rotate(plane.rot); const s = k*1.1;
    c.fillStyle = '#f4efe2'; c.strokeStyle = '#1a1a1a'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(8*s, 0); c.lineTo(2*s, -1.5*s); c.lineTo(1*s, -7*s); c.lineTo(-1.5*s, -7*s); c.lineTo(-2*s, -1.5*s); c.lineTo(-6*s, -1*s); c.lineTo(-7*s, -3.5*s); c.lineTo(-8.5*s, -3.5*s); c.lineTo(-8*s, 0);
    c.lineTo(-8.5*s, 3.5*s); c.lineTo(-7*s, 3.5*s); c.lineTo(-6*s, 1*s); c.lineTo(-2*s, 1.5*s); c.lineTo(-1.5*s, 7*s); c.lineTo(1*s, 7*s); c.lineTo(2*s, 1.5*s); c.closePath(); c.fill(); c.stroke(); c.restore(); }
  if (G.raidPlanned && G.raidSpot && !G.raid){
    const sp = G.raidSpot, a = P(clamp(sp.x + sp.nx*360, 60, W - 60), clamp(sp.y + sp.ny*360, 60, H - 60));
    c.fillStyle = '#1d1b1a'; c.beginPath(); c.ellipse(a[0], a[1], 5*k, 2.4*k, Math.atan2(-sp.ny, -sp.nx), 0, TAU); c.fill();
    c.strokeStyle = '#e4573f'; c.lineWidth = 1.2; c.beginPath(); c.arc(a[0], a[1], 7*k, 0, TAU); c.stroke();
  }
  if (G.raid){ const b = G.raid.boat; dot(b.x, b.y, 3*k, '#2a1a0e', '#ffd36b'); }
  for (const q of pirates) dot(q.x, q.y, (q.kind === 'captain' ? 3.6 : 2.6)*k, '#ff3b2b', '#ffffff');
  netMapMates(c, P, k);
  { const a = P(player.x, player.y); c.save(); c.translate(a[0], a[1]); c.rotate(player.dir); const s = k*1.2;
    c.fillStyle = '#ffd34a'; c.strokeStyle = '#1a1a1a'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(6*s, 0); c.lineTo(-4*s, -4*s); c.lineTo(-2*s, 0); c.lineTo(-4*s, 4*s); c.closePath(); c.fill(); c.stroke(); c.restore(); }
  if (!big){ c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1; c.strokeRect(view.x0*sx, view.y0*sy, (view.x1 - view.x0)*sx, (view.y1 - view.y0)*sy); }
  c.restore();
}

function planeLocal(x, y){
  const c = Math.cos(-plane.rot), s = Math.sin(-plane.rot);
  return [(x - plane.x)*c - (y - plane.y)*s, (x - plane.x)*s + (y - plane.y)*c];
}
function canPlace(id, x, y, who){
  const b = BUILD[id];
  const fp = b.half ? 19 : Math.max(10, b.r || 8);
  if (!(walkable(x-fp, y-fp) && walkable(x+fp, y-fp) && walkable(x-fp, y+fp) && walkable(x+fp, y+fp) && walkable(x, y))) return 'Здесь нельзя строить: вода';
  if (onRunway(x, y, 26)) return 'Не стройте на взлётной полосе';
  const [lx, ly] = planeLocal(x, y);
  if (Math.abs(lx) < 116 && Math.abs(ly) < 134) return 'Слишком близко к самолёту';
  for (const o of objects){
    if (!o.alive) continue;
    const d = dist(x, y, o.x, o.y);
    if (o.type === 'spring'){ if (d < 66) return 'Мешает родник'; continue; }
    if (o.half){ if (Math.abs(x - o.x) < 39 && Math.abs(y - o.y) < 39) return 'Место занято'; continue; }
    if (d < (o.r || 6) + fp + 4) return 'Место занято';
  }
  if (b.half || b.r){
    const R = 11 + (b.half ? 20 : b.r);
    const me = who || player;
    if (dist(x, y, me.x, me.y) < R + 2) return 'Отойдите: вы стоите на месте постройки';
    if (netSomeoneAt(x, y, R + 2, who)) return 'Мешает товарищ';
    for (const p of pirates) if (dist(x, y, p.x, p.y) < R + 2) return 'Мешает пират';
  }
  return '';
}
function updateGhost(){
  if (!G.build){ G.ghost = null; return; }
  const p = player;
  const fx = p.x + Math.cos(p.dir)*52, fy = p.y + Math.sin(p.dir)*52;
  const x = Math.floor(fx/GRID)*GRID + GRID/2, y = Math.floor(fy/GRID)*GRID + GRID/2;
  G.ghost = { x, y, err: canPlace(G.build, x, y) };
}
function placeBuild(){
  const id = G.build; if (!id) return;
  const b = BUILD[id];
  updateGhost();
  const gh = G.ghost;
  if (!gh) return;
  if (gh.err){ toast(gh.err, 'bad'); sfx('bad'); return; }
  if (!canAfford(b.need)){ toast('Не хватает материалов', 'bad'); sfx('bad'); exitBuild(); return; }
  pay(b.need);
  if (NET.role === 'guest') netOp(['b', id, gh.x, gh.y]);   // the host puts it on the island for everybody
  else {
    const o = mk(id, gh.x, gh.y, { struct:true, hp:b.hp, maxhp:b.hp, r:b.r || 0, cd:0, aim:-Math.PI/2, flash:0 });
    if (b.half) o.half = b.half;
    objects.push(o);
    if (id === 'campfire') G.campfire = o;
    if (id === 'workbench') G.workbench = o;
  }
  sfx('place');
  burst(gh.x, gh.y, 'dust', 8);
  if (b.once || !canAfford(b.need)){
    if (!b.once) toast('Материалы для «' + b.name.toLowerCase() + '» кончились');
    exitBuild();
  } else refreshBuildBar();
  updateHUD();
}
// a storm tears at the camp: every so often a gust breaks part of a wall, a torch or the fire
function stormTick(dt){
  if (WX.state !== 'storm' || WX.wind < 0.6){ G.stormT = Math.max(G.stormT || 0, 8); return; }
  G.stormT = (G.stormT || 12) - dt;
  if (G.stormT > 0) return;
  G.stormT = 14 + rnd()*14;
  const list = objects.filter(o => o.alive && (o.type === 'wall' || o.type === 'torch' || o.type === 'campfire' || o.type === 'cannon' || o.type === 'workbench'));
  if (!list.length) return;
  const o = list[Math.floor(rnd()*list.length)];
  const n = o.type === 'torch' ? 1 : o.type === 'campfire' ? 2 : o.type === 'wall' ? 3 : 2;
  damageStruct(o, n, 'storm');
  const near = dist(o.x, o.y, player.x, player.y) < 650;
  if ((G.stormMsgT || 0) <= G.time){
    G.stormMsgT = G.time + 25;
    toast(near ? 'Порыв ветра ударил по постройке: ' + BUILD[o.type].name.toLowerCase() + '. Почините её (E)' : 'Шторм бьёт по лагерю. Проверьте постройки', 'bad');
    netEvent(['t', 'Шторм бьёт по лагерю. Проверьте постройки', 'bad']);
  }
}
function damageStruct(o, n, cause){
  if (!o.alive) return;
  o.hp -= n; o.flash = 0.15;
  burst(o.x, o.y - 10, 'chip', 6, '#8b6439');
  netEvent(['sd', o.x|0, o.y|0]);
  if (o.hp <= 0){
    o.alive = false; o.r = 0;
    if (o === G.campfire) G.campfire = null;
    if (o === G.workbench) G.workbench = null;
    burst(o.x, o.y - 10, 'chip', 16, '#8b6439');
    wtoast((cause === 'storm' ? 'Шторм разрушил: ' : 'Пираты сломали: ') + BUILD[o.type].name.toLowerCase(), 'bad');
  }
}

function restoreRaid(rd, list){

  const day = G.day, base = PIRATE_HP + Math.floor((day-1)/diff().pgrow);
  const ps = [];
  for (const q of list){
    if (!q || !PKIND[q.kind] || !isFinite(q.x) || !isFinite(q.y) || !(q.hp > 0)) continue;
    const ok = walkable(q.x, q.y);
    const max = isFinite(q.max) && q.max > 0 ? q.max : Math.max(2, Math.round(base*PKIND[q.kind].hp));
    ps.push({ type:'pirate', id:++NET.eid, kind:q.kind, x:ok ? q.x : rd.landX, y:ok ? q.y : rd.landY, hp:Math.min(q.hp, max), max, atkT:1 + rnd(), wind:0, dir:0, walkT:rnd()*5, stun:0, flash:0, swing:0, moving:false, seed:isFinite(q.seed) ? q.seed : rnd(),

  }
  if (!ps.length) return;
  G.raid = { boat:{ x:+rd.boat.x, y:+rd.boat.y, a:isFinite(rd.boat.a) ? +rd.boat.a : 0 }, landX:+rd.landX, landY:+rd.landY, ending:!!rd.ending, endT:isFinite(rd.endT) ? +rd.endT : 0, warnedSab:!!rd.warnedSab, boatHp:isFinite(rd.boatHp) ? +rd.boatHp : 5, burn:0, sunk:!!rd.sunk || (isFinite(rd.boatHp) && rd.boatHp <= 0) };

}

  const bodies = netBodies();   // everybody the pirates can see: the hero and, in co-op, the whole crew
  navT -= dt;
  if (navT <= 0){
    navT = 0.5;
    buildNav();
    computeFieldMulti(fieldP, bodies.length ? bodies : [player], 30);
    if (navTick % 3 === 0){ computeField(fieldA, plane.x, plane.y, 132); computeField(fieldB, R.landX, R.landY, 50); }
    navTick++;
  }
  if (G.cockpit && pirates.some(q => !q.dead && dist(q.x, q.y, plane.x, plane.y) < 125)) exitCockpit('Пираты у самолёта! Вы выскочили из кабины', 'bad');
  // a crowd does not swing all at once: at most two pirates wind up a blow at the same moment, the rest look for an opening
  let winding = 0; for (const q of pirates) if (q.wind > 0) winding++;
  for (const p of pirates){
    if (G.mode !== 'play') return;
    const K = PKIND[p.kind];
    p.flash = Math.max(0, p.flash - dt); p.atkT -= dt; p.swing = Math.max(0, p.swing - dt); p.shotCD -= dt; p.flashShot = Math.max(0, p.flashShot - dt);
    p.moving = false;
    if (p.stun > 0){ p.stun -= dt; p.wind = 0; p.aimT = 0; continue; }
    if (p.wind > 0){
      p.wind -= dt;
      if (p.wind <= 0){
        p.swing = 0.25;
        const hb = nearestBody(bodies, p.x, p.y, 38*K.scale);
        if (hb) hurtBody(hb, Math.round((PIRATE_DMG + Math.floor((G.day-1)/diff().pgrow))*K.dmg));
      }
      continue;
    }
    if (p.aimT > 0){
      p.aimT -= dt;
      p.dir += angDiff(Math.atan2(p.aimY - p.y, p.aimX - p.x), p.dir)*Math.min(1, dt*12);
      if (p.aimT <= 0) fireBullet(p);
      continue;
    }
    const tb = nearestBody(bodies, p.x, p.y, 1e9), dPl = tb ? dist(p.x, p.y, tb.x, tb.y) : dist(p.x, p.y, player.x, player.y);
    let goal;
    if (!p.flee && p.kind !== 'captain' && !p.loot && p.hp <= p.max*0.2){
      p.flee = true;
      floats.push({ x:p.x, y:p.y - 40, text:'Бежит!', life:1.2, col:'#ffd0c2' });
    }
    if ((R.ending || p.loot || p.flee) && !boatLost(R)) goal = 'boat';
    else if (p.kind === 'gunner') goal = 'player';
    else if (p.raider && hasInstalled() && dPl > 220) goal = 'plane';
    else goal = 'player';
    p.goal = goal;
    let tx, ty, field;
    if (goal === 'boat'){
      tx = R.landX; ty = R.landY; field = fieldB;
      if (dist(p.x, p.y, tx, ty) < 40){
        p.gone = true;
        if (p.loot){ wtoast('Пираты увезли детали: ' + repName(p.loot) + '. Придётся делать заново', 'bad'); p.loot = null; }
        continue;
      }
    } else if (goal === 'plane'){ tx = plane.x; ty = plane.y; field = fieldA; }
    else { const q = tb || player; tx = q.x; ty = q.y; field = fieldP; }
    if (goal === 'plane' && dist(p.x, p.y, plane.x, plane.y) < 134){
      p.sab += dt;
      p.dir += angDiff(Math.atan2(plane.y - p.y, plane.x - p.x), p.dir)*Math.min(1, dt*8);
      if (!R.warnedSab){ R.warnedSab = true; wtoast('Пираты у самолёта! Они снимают детали', 'bad'); sfx('alarm'); netEvent(['s', 'alarm']); }
      if (p.sab >= 6) steal(p);
      continue;
    }
    p.sab = Math.max(0, p.sab - dt*2);
    const d = dist(p.x, p.y, tx, ty);
    if (p.kind === 'gunner' && goal === 'player' && tb){
      if (d < 360 && d > 140 && p.shotCD <= 0){ p.aimT = 0.7; p.aimX = tb.x; p.aimY = tb.y; p.shotCD = 2.6; continue; }
      if (d < 140){ stepPirate(p, Math.atan2(p.y - ty, p.x - tx), K.sp*dt, dt); continue; }
      if (d < 250){ p.dir += angDiff(Math.atan2(ty - p.y, tx - p.x), p.dir)*Math.min(1, dt*8); continue; }
    }
    if (goal === 'player' && p.kind !== 'gunner' && tb && d < 30*K.scale){
      p.dir += angDiff(Math.atan2(ty - p.y, tx - p.x), p.dir)*Math.min(1, dt*10);
      if (p.atkT <= 0 && winding < 2){ p.atkT = p.kind === 'brute' ? 1.6 : 1.2; p.wind = p.kind === 'brute' ? 0.46 : 0.33; winding++; }
      else if (p.atkT <= 0) p.atkT = 0.25 + Math.random()*0.35;
      continue;
    }
    let a = Math.atan2(ty - p.y, tx - p.x);
    if (d > 70){ const fa = flowAngle(p.x, p.y, field); if (fa !== null) a = fa; }
    const hit = stepPirate(p, a, K.sp*dt*(p.loot || p.flee ? 0.8 : 1), dt);
    if (hit && goal !== 'boat'){
      p.dir += angDiff(Math.atan2(hit.y - p.y, hit.x - p.x), p.dir)*Math.min(1, dt*10);
      if (p.atkT <= 0){ p.atkT = 1.0; p.swing = 0.3; damageStruct(hit, p.kind === 'brute' || p.kind === 'captain' ? 3 : 1.5); sfx('chop'); }
    }
  }
  if (G.mode !== 'play') return;
  for (let i = 0; i < pirates.length; i++){
    for (let j = i+1; j < pirates.length; j++){
      const a = pirates[i], b = pirates[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0.01 && d < 20){
        const k = (20 - d)/2/d;
        if (walkable(a.x - dx*k, a.y - dy*k)){ a.x -= dx*k; a.y -= dy*k; }
        if (walkable(b.x + dx*k, b.y + dy*k)){ b.x += dx*k; b.y += dy*k; }
      }
    }
  }
  pirates = pirates.filter(p => !p.gone && !p.dead);
  if (R.ending && R.endT > 45 && !boatLost(R)){
    for (const p of pirates) if (p.loot) wtoast('Пираты увезли детали: ' + repName(p.loot) + '. Придётся делать заново', 'bad');
    pirates = [];
  }
  if (!pirates.length){
    if (!R.ending){ wtoast('Пираты отбиты!', 'good'); sfx('win'); netEvent(['s', 'win']); unlock('raid'); netEvent(['u', 'raid']); }
    else wtoast('Шлюпка с пиратами ушла в море');
    G.raid = null;
    bullets = [];
    saveGame();
  }
}
function updateBullets(dt){
  const bodies = netBodies();

    b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (!walkable(b.x, b.y) && tAt(b.x, b.y) === SEA){ b.life = 0; continue; }
    for (const o of objects){
      if (!o.alive || !o.struct) continue;
      const hitS = o.half ? (Math.abs(b.x - o.x) < o.half && Math.abs(b.y - o.y) < o.half) : (o.r >= 14 && dist(b.x, b.y, o.x, o.y) < o.r);
      if (hitS){ damageStruct(o, 1); b.life = 0; burst(b.x, b.y - 8, 'chip', 5, '#8b6439'); break; }
    }
    if (b.life <= 0) continue;
    for (const q of bodies){
      if (dist(b.x, b.y, q.x, q.y) < 13){ if (!q.dash){ hurtBody(q, b.dmg); b.life = 0; } break; }
    }
    if (G.mode !== 'play') return;
  }
  bullets = bullets.filter(b => b.life > 0);
}
function hurtPlayer(n){
  if (G.mode !== 'play' || player.down) return;
  if (G.sleep) wakeUp('Вы проснулись от удара!', 'bad');
  if (player.dash){ floats.push({ x:player.x, y:player.y - 40, text:'Уворот!', life:0.9, col:'#bfe6ff' }); return; }
  player.hp -= Math.max(1, Math.round(n*diff().dmg*(inv.armor > 0 ? 0.65 : 1)));
  if (inv.armor > 0 && n >= 6) sfx('metal');
  G.hurtT = 0.45;
  sfx('hurt');
  burst(player.x, player.y - 10, 'blood', 5);
  if (player.hp <= 0){
    player.hp = 0;
    const cause = 'Пираты взяли верх. Частокол, пушки, сабля и вовремя сделанный рывок могли бы удержать лагерь до рассвета.';
    if (NET.role !== 'solo') goDown(cause); else die(cause);
  }
}
function attackPirate(p){
  if (G.atkT > 0) return;
  G.atkT = 0.42;
  player.swingT = 0.24;
  player.act = null;
  player.dir = Math.atan2(p.y - player.y, p.x - player.x);
  const dmg = inv.sword > 0 ? 3 : (inv.axe > 0 || inv.pickaxe > 0 ? 2 : 1);
  if (NET.role === 'guest') netHitRemote(p, dmg);   // the host owns the pirates and boars
  else if (p.type === 'boar') hitBoar(p, dmg, player.x, player.y); else hitPirate(p, dmg, player.x, player.y);
  player.energy = Math.max(0, player.energy - 0.4);
}
function hitPirate(p, dmg, fx, fy){
  if (p.dead) return;
  const heavy = p.kind === 'brute' || p.kind === 'captain';
  p.hp -= dmg; p.flash = 0.18; p.stun = heavy ? 0.1 : 0.22;
  const a = Math.atan2(p.y - fy, p.x - fx), kb = heavy ? 4 : 12;
  const kx = p.x + Math.cos(a)*kb, ky = p.y + Math.sin(a)*kb;
  if (walkable(kx, ky) && !blockAt(kx, ky, 11, p.x, p.y, false)){ p.x = kx; p.y = ky; }
  burst(p.x, p.y - 12, 'blood', 6);
  sfx('hit');
  netEvent(['ph', p.x|0, p.y|0]);
  if (p.hp > 0) return;
  p.dead = true;
  G.kills++;
  burst(p.x, p.y - 10, 'chip', 10, '#9b1f1f');
  netEvent(['pd', p.x|0, p.y|0]);
  if (p.loot){
    const r = REPAIRS.find(q => q.id === p.loot);
    if (r && r.need) for (const [k, v] of Object.entries(r.need)) addLoot(k, v);
    ptoast('Вы отбили украденное: ' + repName(p.loot) + '. Детали снова в инвентаре', 'good'); pach('thief');
    p.loot = null;
  }
  if (p.kind === 'captain'){
    addLoot('metal', 4); addLoot('wire', 1); addLoot('resin', 2);
    floats.push({ x:p.x, y:p.y - 40, text:'Сундук капитана!', life:1.8, col:'#ffe08a' });
    ptoast('Капитан повержен! В его сундуке 4 металла, провод и 2 смолы', 'good'); pach('captain');
    if (NET.actor) wtoast(NET.actor.name + ' победил капитана!', 'good', NET.actor);
  } else {
    const r = rnd();
    if (r < 0.55){ addLoot('metal', 2); floats.push({ x:p.x, y:p.y - 30, text:'+2 металл', life:1.4, col:'#fff4d6' }); }
    else if (r < 0.85){ addLoot('coconut', 1); floats.push({ x:p.x, y:p.y - 30, text:'+1 кокос', life:1.4, col:'#fff4d6' }); }
    else { addLoot('resin', 1); floats.push({ x:p.x, y:p.y - 30, text:'+1 смола', life:1.4, col:'#fff4d6' }); }
  }
  decor.push({ k:'hat', x:p.x, y:p.y, a:rnd()*TAU });
  updateHUD();
}
function updateCannons(dt){
  for (const o of objects){
    if (!o.alive || o.type !== 'cannon') continue;
    o.cd -= dt;
    let best = null, bd = 320;
    for (const p of pirates){ if (p.dead) continue; const d = dist(o.x, o.y, p.x, p.y); if (d < bd){ bd = d; best = p; } }
    if (!best && G.raid && !boatLost(G.raid) && dist(o.x, o.y, G.raid.boat.x, G.raid.boat.y) < 340) best = G.raid.boat;
    if (!best) continue;
    const ta = Math.atan2(best.y - o.y, best.x - o.x);
    o.aim += angDiff(ta, o.aim)*Math.min(1, dt*6);
    if (o.cd <= 0 && Math.abs(angDiff(ta, o.aim)) < 0.25){
      o.cd = 1.6; o.flash = 0.12;
      const sp = 560, mx = o.x + Math.cos(o.aim)*24, my = o.y - 8 + Math.sin(o.aim)*24;
      balls.push({ x:mx, y:my + 8, vx:Math.cos(o.aim)*sp, vy:Math.sin(o.aim)*sp, life:0.62 });
      for (let k = 0; k < 6; k++) particles.push({ x:mx, y:my, vx:Math.cos(o.aim)*40 + (rnd()-0.5)*40, vy:Math.sin(o.aim)*40 - 20 + (rnd()-0.5)*30, life:1.2, max:1.2, type:'smoke', size:5, rot:0, vr:0 });
      sfx('boom');
      netEvent(['cb', mx|0, my|0, Math.round(o.aim*100)]);
    }
  }
  for (const b of balls){
    b.life -= dt; b.x += b.vx*dt; b.y += b.vy*dt;
    for (const p of pirates){
      if (!p.dead && dist(b.x, b.y, p.x, p.y) < 17*PKIND[p.kind].scale){ hitPirate(p, 3, b.x - b.vx*0.05, b.y - b.vy*0.05); b.life = 0; burst(b.x, b.y - 6, 'spark', 10); break; }
    }
    const R = G.raid;
    if (b.life > 0 && R && !boatLost(R) && dist(b.x, b.y, R.boat.x, R.boat.y) < 34){
      b.life = 0; R.boatHp -= 1; burst(b.x, b.y, 'chip', 12, '#7b5634'); burst(b.x, b.y, 'splash', 8); netEvent(['bh', b.x|0, b.y|0]);
      if (R.boatHp <= 0) setBoatAblaze('cannon');
      else if (R.boatHp === 2) wtoast('Ядро пробило шлюпку пиратов. Ещё пара попаданий, и она загорится');
    }
    if (b.life <= 0 && !b.hitFx){ b.hitFx = true; burst(b.x, b.y, 'dust', 5); }
  }
  balls = balls.filter(b => b.life > 0);
}

/* ================= Wild boars =================
   They graze in the jungle and on the grass, run from a person who comes close, and charge when hurt.
   A kill gives two pieces of raw meat; roast it on the campfire. */
let boars = [];
const BOAR = { hp:6, graze:34, run:150, charge:182, dmg:9 };
function boarSpot(far){
  for (let i = 0; i < 400; i++){
    const x = 80 + rnd()*(W - 160), y = 80 + rnd()*(H - 160);
    if (tAt(x, y) < GRASS || !landAround(x, y, 18) || onRunway(x, y, 80)) continue;
    if (dist(x, y, plane.x, plane.y) < 520 || (far && dist(x, y, player.x, player.y) < 650)) continue;
    if (blockAt(x, y, 12, x, y, false)) continue;
    return [x, y];
  }
  return null;
}
function spawnBoars(n, far){
  for (let i = 0; i < n; i++){
    const s = boarSpot(far); if (!s) break;
    boars.push({ type:'boar', id:++NET.eid, x:s[0], y:s[1], dir:rnd()*TAU, hp:BOAR.hp, angry:0, atkT:0, flash:0, walkT:0, moving:false, think:rnd()*3, mode:'graze', seed:rnd() });
  }
}
function boarStep(b, a, sp){
  const nx = b.x + Math.cos(a)*sp, ny = b.y + Math.sin(a)*sp;
  const keepGreen = b.mode === 'graze' && tAt(nx, ny) < GRASS;
  if (!keepGreen && walkable(nx, ny) && landAround(nx, ny, 6) && !blockAt(nx, ny, 10, b.x, b.y, false)){ b.x = nx; b.y = ny; b.moving = true; return true; }
  b.dir += (rnd() < 0.5 ? 1 : -1)*(0.8 + rnd()*1.2);
  return false;
}
function updateBoars(dt){
  const bodies = netBodies().filter(q => !q.sleep);   // a sleeper lies still: boars leave him alone
  for (const b of boars){
    b.flash = Math.max(0, b.flash - dt); b.atkT -= dt; b.moving = false;
    const q = nearestBody(bodies, b.x, b.y, 1e9), d = q ? dist(b.x, b.y, q.x, q.y) : 1e9;
    if (b.angry > 0){
      b.angry -= dt; b.mode = 'charge';
      if (q) b.dir += angDiff(Math.atan2(q.y - b.y, q.x - b.x), b.dir)*Math.min(1, dt*5);
      if (q && d < 24*1.1 && b.atkT <= 0){
        b.atkT = 1.4; hurtBody(q, BOAR.dmg);
        if (q.me){
          const a = Math.atan2(player.y - b.y, player.x - b.x), px = player.x + Math.cos(a)*22, py = player.y + Math.sin(a)*22;
          if (walkable(px, py) && !blockAt(px, py, 11, player.x, player.y, false)){ player.x = px; player.y = py; }
        }
        floats.push({ x:q.x, y:q.y - 36, text:'Кабан!', life:1, col:'#ffb4a0' });
      } else if (d > 26) boarStep(b, b.dir, BOAR.charge*dt);
      if (d > 520) b.angry = 0;
    } else if (q && d < 150){
      b.mode = 'run';
      b.dir += angDiff(Math.atan2(b.y - q.y, b.x - q.x), b.dir)*Math.min(1, dt*6);
      boarStep(b, b.dir, BOAR.run*dt);
    } else {
      b.mode = 'graze';
      b.think -= dt;
      if (b.think <= 0){ b.think = 2 + rnd()*4; b.walking = rnd() < 0.45; b.dir += (rnd() - 0.5)*2.4; }
      if (b.walking) boarStep(b, b.dir, BOAR.graze*dt);
    }
    if (b.moving) b.walkT += dt*(b.mode === 'graze' ? 6 : 16);
  }
}
function hitBoar(b, dmg, fx, fy){
  if (fx === undefined){ fx = player.x; fy = player.y; }
  b.hp -= dmg; b.flash = 0.18; b.angry = 8;
  const a = Math.atan2(b.y - fy, b.x - fx), kx = b.x + Math.cos(a)*10, ky = b.y + Math.sin(a)*10;
  if (walkable(kx, ky) && !blockAt(kx, ky, 10, b.x, b.y, false)){ b.x = kx; b.y = ky; }
  burst(b.x, b.y - 8, 'blood', 6); sfx('hit');
  netEvent(['ph', b.x|0, b.y|0]);
  if (b.hp > 0) return;
  boars = boars.filter(q => q !== b);
  burst(b.x, b.y - 6, 'blood', 10);
  if (NET.actor){ addLoot('meat_raw', 2); ptoast('Кабан добыт: 2 куска сырого мяса. Пожарьте на костре', 'good'); pach('hunter'); return; }
  give('meat_raw', 2, b.x, b.y - 26);
  toast('Кабан добыт: 2 куска сырого мяса. Пожарьте на костре', 'good');

}

/* ================= Actions ================= */
function getAction(o){
  const p = player;
  switch (o.type){
    case 'mate': return o.m && (o.m.f & F_DOWN) ? { label:'Поднять товарища: ' + o.m.name, time:2.5, can:true, kind:'revive' } : null;
    case 'palm':
      if (o.cut) return null;
      if (o.coconuts > 0) return { label:'Сорвать кокос', time:0.6, can:true };
      if (inv.axe > 0) return { label:'Срубить пальму', time:1.0, can:true };
      return { label:'Нужен топор', can:false, why:'Чтобы рубить пальмы, сделайте каменный топор (C)' };
    case 'drift': return { label:'Подобрать плавник', time:0.5, can:true };
    case 'boat':
      if (!G.raid || boatLost(G.raid)) return null;

    case 'rock': return { label:'Добыть камень', time: inv.pickaxe > 0 ? 0.5 : 1.1, can:true };

function fishingSpot(){

      if (t === SHALLOW || t === SEA){ if (r < bd){ bd = r; best = { type:'fishing', x, y, alive:true }; } break; }
    }
  }

}

function findTarget(onlyPirates){

  }

/* ================= Particles ================= */
function burst(x, y, type, n, color){
  for (let i = 0; i < n; i++){
    const a = Math.random()*TAU, sp = 30 + Math.random()*90;
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (type === 'leaf' ? 20 : 60), life:0.5 + Math.random()*0.6, max:1.1, type, size: type === 'leaf' ? 4 : 2 + Math.random()*2, color, rot:Math.random()*TAU, vr:(Math.random()-0.5)*8 });
  }
}
function updateParticles(dt){
  for (const q of particles){
    q.life -= dt;
    q.x += q.vx*dt; q.y += q.vy*dt; q.rot += q.vr*dt;
    if (q.type === 'smoke'){ q.vx *= 0.98; q.vy -= 4*dt; q.size += 10*dt; }
    else if (q.type === 'ember'){ q.vy -= 10*dt; q.vx += (Math.random()-0.5)*40*dt; }
    else if (q.type === 'ripple'){ }
    else if (q.type === 'dust'){ q.vx *= 0.92; q.vy *= 0.92; q.size += 6*dt; }
    else { q.vy += (q.type === 'leaf' ? 60 : 260)*dt; q.vx *= 0.97; }
  }
  particles = particles.filter(q => q.life > 0);
  if (particles.length > 700) particles.splice(0, particles.length - 700);
  for (const f of floats){ f.life -= dt; f.y -= 26*dt; }
  floats = floats.filter(f => f.life > 0);
}

    if (dp < 95){ const a = Math.atan2(c.y - player.y, c.x - player.x); tx = c.x + Math.cos(a)*40; ty = c.y + Math.sin(a)*40; sp = 115; }
    else { c.t -= dt; if (c.t <= 0){ c.t = 2 + Math.random()*3; c.tx = c.hx + (Math.random()-0.5)*160; c.ty = c.hy + (Math.random()-0.5)*100; } }
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d > 3){
      const nx = c.x + dx/d*sp*dt, ny = c.y + dy/d*sp*dt;
      const tt = tAt(nx, ny);
      if (tt === SAND || (tt === SHALLOW && hAt(nx, ny) > 0.02)){ c.x = nx; c.y = ny; c.dir = Math.atan2(dy, dx); c.mv = true; }
      else { c.tx = c.x; c.ty = c.y; c.mv = false; }
    } else c.mv = false;
  }
  for (const g of gulls){ g.a += g.w*dt; g.f += dt*(6 + Math.sin(t*0.7 + g.cx)*3); }
  for (const b of birds){
    if (b.state === 'sit'){
      b.peck -= dt; if (b.peck <= 0){ b.peck = 1 + Math.random()*3; b.pk = 0.3; }
      b.pk = Math.max(0, b.pk - dt);
      const d = player.hidden ? 1e9 : dist(b.x, b.y, player.x, player.y);
      if (d < 130 || WX.state === 'storm' || (G.raid && pirates.some(q => dist(q.x, q.y, b.x, b.y) < 130))){
        const a = Math.atan2(b.y - player.y, b.x - player.x) + (Math.random() - 0.5);
        b.state = 'fly'; b.vx = Math.cos(a)*120; b.vy = Math.sin(a)*120; b.alt = 0; b.t = 0; b.dir = a;
      }
    } else {
      b.t += dt; b.alt = Math.min(70, b.alt + dt*45); b.x += b.vx*dt; b.y += b.vy*dt; b.f += dt*14;
      if (b.t > 9 && WX.state !== 'storm'){
        for (let k = 0; k < 60; k++){
          const x = Math.random()*W, y = Math.random()*H;
          if (tAt(x, y) === SAND && dist(x, y, player.x, player.y) > 450 && !onRunway(x, y, 40)){ b.x = x; b.y = y; b.state = 'sit'; b.alt = 0; break; }
        }
      }
    }
  }
  for (const f of fish) f.a += f.w*dt;
  for (const c of clouds){ c.x += c.v*(1 + WX.wind*2.5)*dt; if (c.x > W + 500) c.x = -500; }
}
function updateTakeoff(dt){
  const T = G.takeoff;
  T.t += dt;
  if (NET.role === 'guest') T.x += T.v*dt;   // the host flies the plane; between its updates we carry it forward
  else {
    T.v = Math.min(420, T.v + 62*dt);
    T.x += T.v*dt;
    if (T.x > RW.x1 + 820) T.alt = Math.min(1.4, T.alt + dt*0.55*(T.v/420));
  }
  plane.x = T.x; plane.rot = lerp(plane.rot, -T.alt*0.05, dt*2);
  engineSet(T.v/420);
  if (T.alt < 0.05 && Math.random() < 0.6){
    particles.push({ x:T.x - 70, y:plane.y + (Math.random()-0.5)*30, vx:-40 - Math.random()*40, vy:(Math.random()-0.5)*20, life:0.8, max:0.8, type:'dust', size:4, rot:0, vr:0 });
  }
  cam.x = lerp(cam.x, T.x + 120, Math.min(1, dt*3));
  cam.y = lerp(cam.y, plane.y - T.alt*40, Math.min(1, dt*3));
  clampCam();
  if (T.t > 11 && !T.done){ T.done = true; win(); }
}

/* ================= Drawing helpers ================= */
function ell(x, y, rx, ry, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); ctx.fill(); }
function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r); c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h); c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r); c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y); c.closePath(); }
function polyPath(cx, cy, R, verts, sy){
  ctx.beginPath();
  for (let i = 0; i < verts.length; i++){
    const a = i/verts.length*TAU;
    const x = cx + Math.cos(a)*R*verts[i], y = cy + Math.sin(a)*R*verts[i]*sy;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
const view = { x0:0, y0:0, x1:0, y1:0 };
const inView = (x, y, m) => x > view.x0 - m && x < view.x1 + m && y > view.y0 - m && y < view.y1 + m;
let oceanGrad = null;

function drawOcean(t){
  if (!oceanGrad){
    oceanGrad = ctx.createRadialGradient(CX, CY, 600*WS, CX, CY, 1900*WS);
    oceanGrad.addColorStop(0, '#2a8fb0'); oceanGrad.addColorStop(0.55, '#1a6d90'); oceanGrad.addColorStop(1, '#0f4d6b');
  }
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(view.x0 - 2, view.y0 - 2, view.x1 - view.x0 + 4, view.y1 - view.y0 + 4);
  const cell = 70;
  const i0 = Math.floor(view.x0/cell) - 1, i1 = Math.floor(view.x1/cell) + 1;
  const j0 = Math.floor(view.y0/cell) - 1, j1 = Math.floor(view.y1/cell) + 1;
  ctx.strokeStyle = 'rgba(220,245,255,1)';
  ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (let i = i0; i <= i1; i++){
    for (let j = j0; j <= j1; j++){
      const hx = hash2(i, j, 41), hy = hash2(i, j, 42), ph = hash2(i, j, 43)*TAU;
      const s = Math.sin(t*1.1 + ph);
      if (s < 0.2) continue;
      const x = i*cell + hx*cell + Math.sin(t*0.4 + ph)*6, y = j*cell + hy*cell;
      ctx.globalAlpha = (s - 0.2)*0.35*SUN.glint*(1 - 0.5*WX.rain);
      ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.quadraticCurveTo(x, y - 3, x + 7, y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawTerrain(){
  const sx = clamp(Math.floor(view.x0/S) - 1, 0, IW - 1), sy = clamp(Math.floor(view.y0/S) - 1, 0, IH - 1);
  const ex = clamp(Math.ceil(view.x1/S) + 1, 1, IW), ey = clamp(Math.ceil(view.y1/S) + 1, 1, IH);
  const sw = ex - sx, sh = ey - sy;
  if (sw <= 0 || sh <= 0) return;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(tcan, sx, sy, sw, sh, sx*S, sy*S, sw*S, sh*S);
}
function drawFoam(t){
  ctx.fillStyle = '#ffffff';
  for (const p of shore){
    if (!inView(p.x, p.y, 30)) continue;
    const w = Math.sin(t*1.5 + p.ph);
    const o1 = 4 + 4*w + TIDE + WX.wind*4;
    ctx.globalAlpha = 0.32 + 0.22*w;
    ctx.beginPath(); ctx.arc(p.x + p.nx*o1, p.y + p.ny*o1, 3.4, 0, TAU); ctx.fill();
    const w2 = Math.sin(t*0.9 + p.ph*1.7);

function drawFish(t){

function drawDecor(t){
  for (let i = 0; i < decor.length; i++){
    const d = decor[i];
    if (LOWFX && (i & 1)) continue;
    if (!inView(d.x, d.y, 20)) continue;
    switch (d.k){
      case 'tuft':
        ctx.strokeStyle = d.c; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let k = -1; k <= 1; k++){ ctx.moveTo(d.x + k*2, d.y); ctx.lineTo(d.x + k*4*d.s + Math.sin(t*1.6 + d.x*0.01)*0.8, d.y - 6*d.s); }
        ctx.stroke(); break;
      case 'flower': ell(d.x, d.y, 2.2, 2.2, d.c); ell(d.x, d.y, 0.9, 0.9, '#f7e27a'); break;
      case 'shell':
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a); ctx.scale(d.s, d.s);
        ctx.fillStyle = d.c; ctx.beginPath(); ctx.moveTo(0, 3); ctx.arc(0, 0, 3.4, Math.PI*1.1, Math.PI*1.9); ctx.closePath(); ctx.fill();
        ctx.restore(); break;
      case 'star':
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a); ctx.scale(d.s, d.s);
        ctx.fillStyle = d.c; ctx.beginPath();
        for (let k = 0; k < 10; k++){ const r = k % 2 ? 2 : 5.5, a = k/10*TAU; if (k) ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); else ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); }

      case 'fern':
        ctx.strokeStyle = '#3e7f3a'; ctx.lineWidth = 2; ctx.lineCap = 'round';

        for (let k = 0; k < 5; k++){ const a = d.a + k/5*TAU; ctx.moveTo(d.x, d.y); ctx.quadraticCurveTo(d.x + Math.cos(a)*6*d.s, d.y + Math.sin(a)*4*d.s - 3, d.x + Math.cos(a)*11*d.s, d.y + Math.sin(a)*7*d.s); }

    }
  }
}
function drawGroundMarks(t){

function quadPt(x0, y0, x1, y1, x2, y2, s){ const u = 1 - s; return [u*u*x0 + 2*u*s*x1 + s*s*x2, u*u*y0 + 2*u*s*y1 + s*s*y2]; }
function sunShadow(x, y, h, w, alphaMul){

function drawShadow(o){

/* ================= Loop ================= */
let last = performance.now();
function frame(now){
  // a slow phone must not slow the game down: long frames are split into several short simulation steps
  const raw = Math.min(0.1, Math.max(0, (now - last)/1000));
  const dt = Math.min(0.05, raw);
  last = now;
  const t = now/1000;
  try {
    // a co-op island never pauses: menus and panels only stop the hero's own input
    const run = !G.paused || NET.role !== 'solo';
    if (G.mode === 'play' && run){
      let rest = raw, n = 0;
      while (rest > 0.0005 && n < 3 && G.mode === 'play' && (!G.paused || NET.role !== 'solo')){ const s = Math.min(0.034, rest); update(s); rest -= s; n++; }
    }
    else if (G.mode === 'takeoff') updateTakeoff(dt);
    else if (G.mode === 'title'){ cam.x = CX + Math.cos(t*0.04)*420*WS; cam.y = CY + Math.sin(t*0.04)*240*WS; clampCam(); updateSun(); }
    netTick(dt, now);
    if (!G.paused || NET.role !== 'solo'){ updateAmbient(dt, t); updateParticles(dt); }
    if (!introCover){ render(t); adaptQuality(raw); }
    miniT -= dt;
    if (miniT <= 0 && G.mode === 'play'){ miniT = 0.2; renderMini(); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
