/* ================= Co-op outside Claude: Wi-Fi and the internet =================
   The Android app and the stand-alone page have no Claude rooms. They get the same room interface from a small
   relay: every presence a player sets is sent to the other players (and re-sent every second, so a newcomer or a
   lost message catches up). Two carriers:
   - Wi-Fi: the app's native relay (window.LFLan): the host phone runs it, the others connect to it;
   - internet: a public MQTT server over a secure WebSocket; the island's code tells which server. */
// Where the internet game meets. The 5th sign of an island's code is the number of the server in this list, so every
// copy of the game must keep the same order: our own relay first (Railway), then two public MQTT servers as a reserve.
// LF_OWN_SERVER is filled in by the build; a page served by our own server also finds it at its own address.
const LF_OWN_SERVER = '';
function ownServer(){
  if (window.__lfServer !== undefined) return window.__lfServer;
  if (LF_OWN_SERVER) return LF_OWN_SERVER;
  if (/^https?:$/.test(location.protocol) && window.__lfHosted) return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  return '';
}
const MQTT_SERVERS = (window.__mqttServers || [ownServer() ? 'relay:' + ownServer() : 'none:', 'wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt']).slice(0, 9);
// one entry of the list: our relay, a public MQTT server, or an empty seat kept so the numbers stay the same
function busConnect(entry, topic, timeoutMs){
  if (entry.startsWith('relay:')) return relayConnect(entry.slice(6), topic, timeoutMs);
  if (entry.startsWith('none:')) return Promise.reject(new Error('no server'));
  return mqttConnect(entry, topic, timeoutMs);
}
const MQTT_BASE = 'lastflight-ra1904/v1/';
function deepFreeze(o){ if (o && typeof o === 'object'){ Object.freeze(o); for (const k in o) deepFreeze(o[k]); } return o; }

// the room interface (join, presence, peers, onPeers, leave) on top of a carrier that broadcasts JSON to the other players
function relayApi(bus){
  const me = 'c' + Math.random().toString(36).slice(2, 12);
  const rooms = new Map(), errs = new Set();
  let closed = false;
  function room(name){
    let r = rooms.get(name);
    if (!r){ r = { name, joined:false, my:null, myObj:Object.freeze({}), peers:new Map(), snap:null, sendT:0, lastSend:0, handlers:new Set() }; rooms.set(name, r); }
    return r;
  }
  function snapshot(r){
    if (r.snap) return r.snap;
    const list = [Object.freeze({ peer:me, by:null, isMe:true, sameTab:true, kind:'viewer', guest:false, presence:r.myObj, updatedAt:Date.now() })];
    for (const q of r.peers.values()) list.push(q.frozen);
    return (r.snap = Object.freeze(list));
  }
  function changed(r){ r.snap = null; }
  function sendNow(r){ r.sendT = 0; r.lastSend = performance.now(); if (r.joined && r.my && !closed) bus.send({ r:r.name, c:me, p:r.my }); }
  bus.onMsg = m => {
    if (!m || typeof m !== 'object' || m.c === me || typeof m.c !== 'string' || typeof m.r !== 'string') return;
    const r = rooms.get(m.r);
    if (!r || !r.joined) return;
    if (m.x){ if (r.peers.delete(m.c)) changed(r); return; }
    if (!m.p || typeof m.p !== 'object') return;
    const raw = JSON.stringify(m.p), cur = r.peers.get(m.c), now = Date.now();
    if (cur && cur.raw === raw){ cur.seen = now; return; }
    r.peers.set(m.c, { raw, seen:now, frozen:Object.freeze({ peer:m.c, by:null, isMe:false, sameTab:false, kind:'viewer', guest:false, presence:deepFreeze(m.p), updatedAt:now }) });
    changed(r);
  };
  bus.onDown = code => { for (const h of errs) try { h({ code:code || 'upstream_error', message:'connection lost' }); } catch (e) {} };
  const keep = setInterval(() => {
    if (closed) return;
    const now = Date.now();
    for (const r of rooms.values()){
      if (!r.joined) continue;
      if (performance.now() - r.lastSend > 900) sendNow(r);   // keepalive: newcomers and lost messages catch up
      for (const [c, q] of r.peers) if (now - q.seen > 6000){ r.peers.delete(c); changed(r); }
    }
  }, 500);
  function roomApi(r){
    return {
      name:r.name,
      presence(patch){
        const next = Object.assign({}, r.my || {});
        for (const k in patch){ if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
        r.my = next; r.myObj = deepFreeze(JSON.parse(JSON.stringify(next))); r.snap = null;
        if (!r.sendT){ const wait = Math.max(0, 45 - (performance.now() - r.lastSend)); r.sendT = setTimeout(() => sendNow(r), wait); }
        return Promise.resolve();
      },
      peers(){ return snapshot(r); },
      onPeers(h, onErr){ if (onErr) errs.add(onErr); r.handlers.add(h); return () => { r.handlers.delete(h); if (onErr) errs.delete(onErr); }; },
      leave(){ if (r.joined && !closed) bus.send({ r:r.name, c:me, x:1 }); r.joined = false; r.peers.clear(); r.my = null; r.myObj = Object.freeze({}); r.snap = null; return Promise.resolve(); },
      connected(){ return !closed; }
    };
  }
  return {
    me,
    online(){ return !closed && (!bus.up || bus.up()); },
    join(name){ const r = room(name); r.joined = true; return Promise.resolve(roomApi(r)); },
    peers(){ return Object.freeze([]); },
    presence(){ return Promise.resolve(); },
    onPeers(){ return () => {}; },
    close(){
      if (closed) return;
      for (const r of rooms.values()) if (r.joined){ try { bus.send({ r:r.name, c:me, x:1 }); } catch (e) {} r.joined = false; }
      closed = true; clearInterval(keep);
      setTimeout(() => { try { bus.close(); } catch (e) {} }, 300);
    }
  };
}

// ---------- internet: our own relay (server.js): one WebSocket per player, the server passes each line to the rest of the room ----------
function relayConnect(base, topic, timeoutMs){
  return new Promise((resolve, reject) => {
    const url = base + (base.includes('?') ? '&' : '?') + 'room=' + encodeURIComponent(topic.replace(/[^a-z0-9-]/g, '-').slice(-40));
    let ws, ready = false, wanted = true, settled = false, retry = 0, downT = 0, pingT = 0;
    const bus = { onMsg:null, onDown:null, up:() => ready,
      send(o){ if (ready) { try { ws.send(JSON.stringify(o)); } catch (e) {} } },
      close(){ wanted = false; ready = false; clearTimeout(downT); clearInterval(pingT); try { ws && ws.close(); } catch (e) {} } };
    function fail(why){ try { ws && ws.close(); } catch (e) {} if (!settled){ settled = true; wanted = false; reject(new Error(why)); } }
    function open(){
      try { ws = new WebSocket(url); } catch (e) { fail('socket'); return; }
      ws.onopen = () => {
        ready = true; retry = 0; clearTimeout(downT); downT = 0;
        clearInterval(pingT); pingT = setInterval(() => { try { ws.send('{"ping":1}'); } catch (e) {} }, 25000);   // keeps proxies from dropping a quiet line
        if (!settled){ settled = true; resolve(bus); }
      };
      ws.onmessage = e => { if (typeof e.data !== 'string') return; try { const m = JSON.parse(e.data); if (m && !m.ping && bus.onMsg) bus.onMsg(m); } catch (x) {} };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearInterval(pingT);
        const was = ready; ready = false;
        if (!was && !settled){ fail('closed'); return; }
        if (!wanted) return;
        if (!downT) downT = setTimeout(() => { wanted = false; if (bus.onDown) bus.onDown('upstream_error'); }, 20000);
        retry++; setTimeout(() => { if (wanted) open(); }, Math.min(4000, 500*retry));
      };
    }
    setTimeout(() => { if (!settled) fail('timeout'); }, timeoutMs || 7000);
    open();
  });
}

// ---------- internet, reserve: a minimal MQTT 3.1.1 client over WebSocket (QoS 0, no retained messages) ----------
function mqttConnect(url, topic, timeoutMs){
  return new Promise((resolve, reject) => {
    const enc = new TextEncoder(), dec = new TextDecoder();
    const me = 'lf' + Math.random().toString(36).slice(2, 14);
    let ws, buf = new Uint8Array(0), ready = false, wanted = true, retry = 0, pingT = 0, downT = 0;
    const bus = { onMsg:null, onDown:null, send, close, up:() => ready };
    const varint = n => { const out = []; do { let b = n % 128; n = Math.floor(n/128); if (n > 0) b |= 128; out.push(b); } while (n > 0); return out; };
    const str = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
    function packet(type, body){ const head = [type, ...varint(body.length)]; const p = new Uint8Array(head.length + body.length); p.set(head, 0); p.set(body, head.length); return p; }
    function raw(p){ try { if (ws && ws.readyState === 1) ws.send(p); } catch (e) {} }
    function send(obj){
      if (!ready) return;
      const t = str(topic + '/' + me), pl = enc.encode(JSON.stringify(obj));
      const body = new Uint8Array(t.length + pl.length); body.set(t, 0); body.set(pl, t.length);
      raw(packet(0x30, body));
    }
    function close(){ wanted = false; ready = false; clearInterval(pingT); clearTimeout(downT); try { raw(new Uint8Array([0xE0, 0])); ws && ws.close(); } catch (e) {} }
    function onPacket(type, body){
      const kind = type >> 4;
      if (kind === 2){   // CONNACK
        if (body[1] !== 0){ fail('refused ' + body[1]); return; }
        raw(packet(0x82, new Uint8Array([0, 1, ...str(topic + '/#'), 0])));
      } else if (kind === 9){   // SUBACK
        if (body[2] === 0x80){ fail('subscribe refused'); return; }
        const first = !settled; ready = true; retry = 0; clearTimeout(downT); downT = 0;
        if (first && wanted){ settled = true; resolve(bus); }
      } else if (kind === 3){   // PUBLISH
        const tl = (body[0] << 8) | body[1];
        let off = 2 + tl;
        if ((type >> 1) & 3) off += 2;   // QoS above 0 carries a packet id
        try { const m = JSON.parse(dec.decode(body.subarray(off))); if (bus.onMsg) bus.onMsg(m); } catch (e) {}
      }
    }
    function onData(data){
      const add = new Uint8Array(data), b = new Uint8Array(buf.length + add.length);
      b.set(buf, 0); b.set(add, buf.length); buf = b;
      for (;;){
        if (buf.length < 2) return;
        let len = 0, mul = 1, i = 1, byte;
        do { if (i >= buf.length) return; byte = buf[i++]; len += (byte & 127)*mul; mul *= 128; } while (byte & 128 && i < 5);
        if (buf.length < i + len) return;
        const type = buf[0], body = buf.subarray(i, i + len);
        buf = buf.slice(i + len);
        onPacket(type, body);
      }
    }
    let settled = false;
    function fail(why){
      try { ws && ws.close(); } catch (e) {}
      if (!ready && !settled){ settled = true; wanted = false; reject(new Error(why)); }
    }
    function open(){
      try { ws = new WebSocket(url, ['mqtt']); } catch (e) { fail('socket'); return; }
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        const body = [...str('MQTT'), 4, 0x02, 0, 60, ...str(me)];
        raw(packet(0x10, new Uint8Array(body)));
        clearInterval(pingT);
        pingT = setInterval(() => raw(new Uint8Array([0xC0, 0])), 25000);
      };
      ws.onmessage = e => { if (e.data instanceof ArrayBuffer) onData(e.data); };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearInterval(pingT);
        const was = ready; ready = false; buf = new Uint8Array(0);
        if (!was && !settled && retry === 0){ fail('closed'); return; }
        if (!wanted) return;
        // a phone changes networks or sleeps for a moment: reconnect quietly, give up after about 20 seconds
        if (!downT) downT = setTimeout(() => { wanted = false; if (bus.onDown) bus.onDown('upstream_error'); }, 20000);
        retry++; setTimeout(() => { if (wanted) open(); }, Math.min(4000, 500*retry));
      };
    }
    setTimeout(() => { if (!ready && !settled) fail('timeout'); }, timeoutMs || 7000);
    open();
  });
}

// ---------- Wi-Fi: the Android app's native relay ----------
const LAN = { bus:null, waiting:null, found:new Map() };
function lanBus(){
  const bus = { onMsg:null, onDown:null, up:() => true, send:o => { try { window.LFLan.send(JSON.stringify(o)); } catch (e) {} }, close:() => { try { window.LFLan.stop(); } catch (e) {} if (LAN.bus === bus) LAN.bus = null; } };
  LAN.bus = bus;
  return bus;
}
// everything the native relay hands to the page: messages, connection news and the beacons of islands nearby
window.__lfLan = items => {
  if (!Array.isArray(items)) return;
  for (const it of items){
    if (!Array.isArray(it)) continue;
    if (it[0] === 'm'){ if (LAN.bus && LAN.bus.onMsg){ try { LAN.bus.onMsg(JSON.parse(it[1])); } catch (e) {} } continue; }
    const type = it[1], a = it[2], b = it[3];
    if (type === 'beacon') lanBeacon(a, b);
    else if (type === 'connected' && LAN.waiting){ const w = LAN.waiting; LAN.waiting = null; w.ok(); }
    else if (type === 'error' && a === 'connect' && LAN.waiting){ const w = LAN.waiting; LAN.waiting = null; w.no(b); }
    else if (type === 'closed' && LAN.bus && LAN.bus.onDown) LAN.bus.onDown('upstream_error');
  }
};
function lanBeacon(ip, text){
  const f = String(text).split('|');   // LFLAN1|code|name|port|players|day
  if (f[0] !== 'LFLAN1' || !/^[a-z0-9]{4}$/.test(f[1] || '')) return;
  LAN.found.set(ip, { ip, code:f[1], name:cleanName(f[2] || '').slice(0, 18), port:clamp(parseInt(f[3], 10) || 47104, 1, 65535), n:clamp(parseInt(f[4], 10) || 1, 1, NET_MAX), day:Math.max(1, parseInt(f[5], 10) || 1), seen:Date.now() });
  if (screenEl.dataset.view === 'coop') netRefreshLan();
}
function lanFound(){ const now = Date.now(); for (const [k, v] of LAN.found) if (now - v.seen > 4500) LAN.found.delete(k); return [...LAN.found.values()]; }
function lanConnect(ip, port){
  return new Promise((ok, no) => {
    LAN.waiting = { ok, no };
    try { window.LFLan.join(ip, port); } catch (e) { LAN.waiting = null; no(e); return; }
    setTimeout(() => { if (LAN.waiting){ LAN.waiting = null; no(new Error('timeout')); } }, 9000);
  });
}
function lanBeaconText(){ return ['LFLAN1', NET.code, (SETTINGS.name || 'Игрок').replace(/\|/g, ' '), NET.lanPort || 47104, netCrewSize(), G.day].join('|'); }

/* ================= Co-op: up to four players on one island =================
   Works inside Claude through the artifact "room". The host runs the island: time, weather, regrowth, pirates,
   boars, raids and the plane. Every player walks their own character and keeps their own health and bag.
   Everything travels as presence (state, not messages), so a lost update heals itself with the next one:
   - main room "lf-<code>": each player's character; the host adds the clock, pirates, boars, shots, gifts, damage and events;
   - world room "lf-<code>-w": the host streams changed island objects by version, each guest confirms the version it has.
   A guest's own changes (a chopped tree, a placed wall, a hit pirate) go to the host as a numbered list of operations
   the host confirms; until then the guest keeps showing its own result. */
const NET_V = 1, NET_MAX = 2;   // two players on one island
const F_PLAY = 1, F_MOVE = 2, F_DASH = 4, F_HID = 8, F_SLEEP = 16, F_ABOARD = 32, F_TORCH = 64, F_ARMOR = 128, F_DOWN = 256, F_SWORD = 512, F_AXE = 1024, F_PICK = 2048;
const SLOT_COL = [
  { shirt:'#e2862a', stripe:'#a65a14', cap:'#2c5978', capD:'#244a64', capL:'#3c7096', ui:'#f29a2e' },
  { shirt:'#4c9a52', stripe:'#2f6a35', cap:'#8a2f2a', capD:'#6f2420', capL:'#a8463e', ui:'#6fd27a' },
  { shirt:'#8a5bb8', stripe:'#62408a', cap:'#2f6b5a', capD:'#24564a', capL:'#3f8a74', ui:'#c08cff' },
  { shirt:'#3f86c9', stripe:'#28609a', cap:'#c96a2a', capD:'#a8561f', capL:'#e08a4a', ui:'#6db7ff' }
];
const PK = ['sailor','brute','gunner','captain'];
const WXS = ['clear','cloudy','rain','storm'];
const ENG = ['off','warming','ready'];
const COOP_PROF = 'last-flight-coop-';
const CODE_ABC = 'abcdefghjkmnpqrstuvwxyz23456789';

function utf8Len(s){ let n = 0; for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); if (c < 0x80) n++; else if (c < 0x800) n += 2; else if (c >= 0xD800 && c <= 0xDBFF){ n += 4; i++; } else n += 3; } return n; }
const jlen = o => utf8Len(JSON.stringify(o));
const r1 = v => Math.round(v*10)/10, r2 = v => Math.round(v*100)/100;
const fin = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
// presence keys must look like identifiers: a peer label becomes p_<label>
const pk = peer => 'p_' + String(peer).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 60);
const cleanName = n => String(n).replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u2064\ufeff]/g, '').trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ---------- island objects as data ---------- */
// what can change on an object, with one-letter keys; booleans travel as 0/1
const SK = [['alive','a',1],['coconuts','k'],['hits','h'],['cut','c',1],['charges','g'],['ripe','p',1],['resin','s',1],['opened','o',1],['hp','H'],['maxhp','M'],['fallA','f'],['r','r'],['R','R']];
function objState(o){
  const s = {};
  for (const [k, a, b] of SK){ const v = o[k]; if (v === undefined || v === null) continue; s[a] = b ? (v ? 1 : 0) : r2(+v || 0); }
  return s;
}
function applyState(o, s){ for (const [k, a, b] of SK){ if (!(a in s)) continue; const v = s[a]; o[k] = b ? !!v : (typeof v === 'number' && isFinite(v) ? v : o[k]); } }
const objSig = o => JSON.stringify(objState(o));
const SKIP_FULL = { flash:1, fallT:1, cd:1 };
function roundDeep(v){ if (typeof v === 'number') return isFinite(v) ? r2(v) : 0; if (Array.isArray(v)) return v.map(roundDeep); if (v && typeof v === 'object'){ const o = {}; for (const k in v) o[k] = roundDeep(v[k]); return o; } return v; }
// the whole object, for things the guest's own island does not have: new driftwood, buildings
function objFull(o){ const d = {}; for (const k in o){ if (SKIP_FULL[k] || typeof o[k] === 'function') continue; d[k] = roundDeep(o[k]); } return d; }
function placeholderObj(){ return { type:'drift', x:-9999, y:-9999, alive:false, r:0, seed:0, a:0, len:0, ph:true }; }
// the island as every device generates it, to know which objects the host has changed since the crash
function pristineWorld(){
  const keep = { objects, crabs, birds, gulls, fish, clouds, rng, px:plane.x, py:plane.y, pr:plane.rot };
  genWorld();
  const res = objects.map(o => ({ t:o.type, x:o.x, y:o.y, sig:objSig(o) }));
  objects = keep.objects; crabs = keep.crabs; birds = keep.birds; gulls = keep.gulls; fish = keep.fish; clouds = keep.clouds; rng = keep.rng;
  plane.x = keep.px; plane.y = keep.py; plane.rot = keep.pr;
  return res;
}

/* ---------- small helpers used all over the game ---------- */
function mateName(m){ return (m.by && NET.names.get(m.by)) || m.nm || (m.host ? 'Хозяин острова' : 'Игрок ' + (m.slot + 1)); }
function newMate(peer, by){
  return { peer, by:by || null, slot:1, admitted:false, playing:false, host:false, x:0, y:0, rx:0, ry:0, dir:0, rdir:0, f:0, hp:100,
    walkT:0, swing:0, act:null, opSeq:0, wa:0, es:-1, seenAt:0, lastPs:null, lastMe:null, joinT:0, told:false, get name(){ return mateName(this); } };
}
function netCrewSize(){ let n = 1; for (const m of NET.mates.values()) if (m.admitted && m.playing) n++; return NET.role === 'solo' ? 1 : n; }
function netCrewState(){ const c = { total:0, aboard:0, down:0 }; for (const m of NET.mates.values()){ if (!m.admitted) continue; c.total++; if (m.f & F_ABOARD) c.aboard++; if (m.f & F_DOWN) c.down++; } return c; }
function netPassengers(){ if (NET.role === 'guest') return NET.passengers; let n = 0; for (const m of NET.mates.values()) if (m.admitted && m.playing && (m.f & F_ABOARD)) n++; return n; }
// people the pirates and boars can see: the host's own hero and, on the host, every guest
function netBodies(){
  const out = [];
  if (!player.hidden && !player.down) out.push({ x:player.x, y:player.y, me:true, dash:!!player.dash, sleep:!!G.sleep });
  if (NET.role === 'host') for (const m of NET.mates.values()){
    if (!m.admitted || !m.playing || (m.f & (F_HID | F_DOWN))) continue;
    out.push({ x:m.x, y:m.y, m, dash:!!(m.f & F_DASH), sleep:!!(m.f & F_SLEEP) });
  }
  return out;
}
function nearestBody(list, x, y, maxD){ let best = null, bd = maxD; for (const b of list){ const d = dist(x, y, b.x, b.y); if (d < bd){ bd = d; best = b; } } return best; }

function netHurtMate(m, n){
  NET.dmg[pk(m.peer)] = (NET.dmg[pk(m.peer)] || 0) + n;
  if (m.f & F_SLEEP) m.f &= ~F_SLEEP;
  burst(m.x, m.y - 10, 'blood', 5);
  if (dist(m.x, m.y, player.x, player.y) < 600) sfx('hit');
}
function netFarFromAll(x, y, d){
  if (dist(x, y, player.x, player.y) < d) return false;
  if (NET.role === 'host') for (const m of NET.mates.values()) if (m.playing && dist(x, y, m.x, m.y) < d) return false;
  return true;
}
// is another player standing where a building would go
function netSomeoneAt(x, y, r, who){
  if (NET.role === 'solo') return false;
  if (who && !player.hidden && dist(x, y, player.x, player.y) < r) return true;
  for (const m of NET.mates.values()){ if (m === who || !m.playing || (m.f & F_HID)) continue; if (dist(x, y, m.x, m.y) < r) return true; }
  return false;
}
// loot and messages for whoever made the move right now: a guest whose blow the host is processing, or the host's own hero
function addLoot(id, n){ if (NET.actor) netGrant(NET.actor, id, n); else inv[id] = (inv[id] || 0) + n; }
function ptoast(msg, kind){ if (NET.actor) netEvent(['t', msg, kind || ''], '+' + NET.actor.peer); else toast(msg, kind); }
function pach(id){ if (NET.actor) netEvent(['u', id], '+' + NET.actor.peer); else unlock(id); }
// news for the whole crew: shown here and sent to every guest (except one, if given)
function wtoast(msg, kind, ex){ toast(msg, kind); netEvent(['t', msg, kind || ''], ex ? '-' + ex.peer : ''); }
function netEvent(e, to){
  if (NET.role !== 'host') return;
  NET.events.push({ s:++NET.evSeq, to:to || '', e, at:performance.now() });
  if (NET.events.length > 80) NET.events.splice(0, NET.events.length - 80);
}
function netGrant(m, id, n){ if (!m || !(n > 0) || !ITEMS[id]) return; const g = NET.grants[pk(m.peer)] || (NET.grants[pk(m.peer)] = {}); g[id] = (g[id] || 0) + n; }
function netRunwayCheck(){
  if (G.repairs.runway) return;
  const left = objects.filter(b => b.type === 'boulder' && b.alive).length;
  if (left === 0){ G.repairs.runway = true; wtoast('Взлётная полоса расчищена', 'good'); sfx('repair'); }
  else wtoast('Валунов на полосе осталось: ' + left);
}
// what everybody else sees and hears when an object changes under somebody else's hands
function netObjFx(o, was){
  if (dist(o.x, o.y, player.x, player.y) > 700) return;
  const ty = o.type;
  if (was.alive && !o.alive){
    if (ty === 'rock' || ty === 'boulder'){ decor.push({ k:'pebble', x:o.x, y:o.y, s:ty === 'rock' ? 1.5 : 1.8 }); burst(o.x, o.y - 10, 'chip', 10, '#a8a59c'); sfx('stone'); }
    else if (STRUCT[ty]){ burst(o.x, o.y - 10, 'chip', 14, '#8b6439'); sfx('chop'); }
    else { burst(o.x, o.y - 6, 'dust', 6); sfx(ty === 'debris' || ty === 'wreck' ? 'metal' : 'pick'); }
  } else if (!was.cut && o.cut){
    if (ty === 'vine' || ty === 'bigtree'){ o.fallT = 2.4; const fx = o.x + Math.cos(o.fallA || 0)*60, fy = o.y + Math.sin(o.fallA || 0)*30; burst(fx, fy - 20, 'leaf', 18); burst(fx, fy, 'dust', 8); }
    else burst(o.x, o.y - 40, 'leaf', 10);
    sfx('chop');
  } else if (o.alive && isFinite(was.hp) && o.hp < was.hp){ o.flash = 0.15; burst(o.x, o.y - 10, 'chip', 6, '#8b6439'); }
  else if (o.alive && isFinite(was.hp) && o.hp > was.hp){ burst(o.x, o.y - 10, 'dust', 8); sfx('place'); }
  else if (o.alive){
    if (ty === 'rock' || ty === 'boulder'){ burst(o.x, o.y - 10, 'chip', 6, '#a8a59c'); sfx('stone'); }
    else if (ty === 'palm' || ty === 'vine' || ty === 'bigtree'){ burst(o.x, o.y - 30, 'leaf', 4); sfx('chop'); }
    else if (ty === 'wreck'){ burst(o.x, o.y - 10, 'spark', 8); sfx('metal'); }
    else if (ty === 'bush' || ty === 'crate'){ burst(o.x, o.y - 14, 'leaf', 4); sfx('pick'); }
  }
}

/* ---------- start, join, leave ---------- */
function netCode(){ let s = ''; for (let i = 0; i < 4; i++) s += CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]; return s; }
function netErrText(e){
  const c = e && e.code;
  if (c === 'not_permitted') return 'в этом просмотре совместная игра недоступна';
  if (c === 'limit_reached') return 'сервер сейчас занят, попробуйте через минуту';
  if (c === 'not_granted' || c === 'revoked') return 'нет доступа: войдите в Claude под своим аккаунтом';
  if (c === 'offline') return NET.inClaude ? 'нет связи с сервером для игры с приложением. Если интернет работает, значит Claude не разрешает этой странице выходить на внешний сервер. Тогда откройте остров в приложении на телефоне или в файле игры для браузера' : 'нет связи с сервером совместной игры. Проверьте интернет на телефоне';
  if (c === 'lan') return 'не удалось открыть остров в сети. Проверьте, что Wi‑Fi или точка доступа включены';
  if (c === 'lanjoin') return 'телефон-хозяин не отвечает. Проверьте, что оба телефона в одной сети Wi‑Fi и остров открыт';
  return 'нет связи';
}
function netResetState(){
  Object.assign(NET, { mates:new Map(), pmap:new Map(), bmap:new Map(), slots:new Map(), k:1, actor:null, giveTo:null,
    ver:0, objVer:[], objSig:[], full:[], n0:0, evSeq:0, events:[], grants:{}, dmg:{}, rev:{}, sendT:0, sendWT:0, lobbyT:0, lastOpen:'', lastW:'', closing:0, shrink:0,
    hostPeer:'', hostBy:null, hostMain:null, hostWorld:null, hostMainAt:0, hostSeenAt:0, hostFoundAt:0, hostVer:0, ack:0, opSeq:0, ops:[], pend:{}, gSig:[],
    evSeen:-1, gotGr:{}, gotDm:0, gotRv:0, slot:0, admitted:false, stage:'', joinAt:0, dawnIdx:null, endAt:0, lastSent:'', lastSentAt:0, profT:0, n0Bad:false,
    hostCockpit:false, passengers:0, isl:'' });
  G.aboard = false;
}
function netRoomErr(e){
  const c = e && e.code;
  if (NET.role === 'solo' || !c) return;
  if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed' || c === 'not_permitted' || c === 'limit_reached' || c === 'upstream_error'){
    if (G.mode === 'play' || G.mode === 'takeoff' || NET.stage === 'wait') netEnd(NET.transport === 'lan' && NET.role === 'guest' ? 'Телефон хозяина острова отключился от сети или закрыл игру. Ваша сумка сохранена, на этот остров можно вернуться.' : 'Связь с совместной игрой потеряна (' + netErrText(e) + ').');
  }
}
function netPresErr(e){ if (e && e.code === 'invalid_argument') NET.shrink = Math.min(6, NET.shrink + 1); else netRoomErr(e); }
// the two rooms of one session: Claude's own rooms, or the relay over Wi-Fi or the internet
async function netOpenRooms(api, code){
  const base = NET.transport === 'lan' ? 'lf-lan' : 'lf-' + code;
  const rm = await api.join(base), rw = await api.join(base + '-w');
  rm.onPeers(() => {}, netRoomErr);
  rw.onPeers(() => {}, netRoomErr);
  return [rm, rw];
}
function netDropSession(api, rooms){
  for (const r of rooms || []) { try { r.leave().catch(() => {}); } catch (e) {} }
  if (api && api !== NET.api && api.close) api.close();
}
// tr: 'claude' (rooms of the Claude page), 'lan' (Wi-Fi, Android app), 'net' (internet relay)
async function netHostStart(save, tr){
  tr = tr || 'claude';
  if (NET.busy || (tr === 'claude' && !NET.api) || (tr === 'lan' && !window.LFLan)) return;
  NET.busy = true;
  NET.transport = tr;
  netWait(tr === 'lan' ? 'Открываем остров в сети Wi‑Fi…' : tr === 'net' ? 'Подключаемся к серверу совместной игры…' : 'Открываем остров для друзей…');
  let code = netCode(), api = null, rooms = null, lanInfo = null;
  try {
    if (tr === 'claude'){
      const taken = new Set(netOpenIslands().map(x => x.code));
      for (let k = 0; k < 30 && taken.has(code); k++) code = netCode();
      api = NET.api;
    } else if (tr === 'lan'){
      api = relayApi(lanBus());
      NET.code = code; NET.lanPort = 0;
      lanInfo = JSON.parse(window.LFLan.host(lanBeaconText()) || '{}');
      if (lanInfo.error || !lanInfo.port) throw { code:'lan' };
    } else {
      let bus = null;
      for (let i = 0; i < MQTT_SERVERS.length && !bus && screenEl.dataset.view === 'coop-wait'; i++){
        const c = code.slice(0, 4) + (i + 1);
        try { bus = await busConnect(MQTT_SERVERS[i], MQTT_BASE + c, 7000); code = c; } catch (e) {}
      }
      if (!bus) throw { code:'offline' };
      api = relayApi(bus);
    }
    rooms = await netOpenRooms(api, code);
  } catch (e) {
    NET.busy = false; netDropSession(api, rooms);
    if (screenEl.dataset.view === 'coop-wait') netMsg('Не удалось открыть остров: ' + netErrText(e) + '.');
    return;
  }
  NET.busy = false;
  if (screenEl.dataset.view !== 'coop-wait'){ netDropSession(api, rooms); return; }   // cancelled meanwhile
  netResetState();
  NET.transport = tr; NET.sapi = api; NET.rm = rooms[0]; NET.rw = rooms[1];
  NET.role = 'host'; NET.code = code; NET.slot = 0; NET.stage = 'play';
  if (lanInfo){ NET.lanIps = Array.isArray(lanInfo.ips) ? lanInfo.ips.filter(x => typeof x === 'string').slice(0, 4) : []; NET.lanPort = lanInfo.port | 0; }
  netFindMe();
  startGame(save);
  netHostInitWorld();
  if (tr === 'lan'){
    try { window.LFLan.beacon(lanBeaconText()); } catch (e) {}
    toast('Остров открыт в сети Wi‑Fi. Друг увидит его в списке «Рядом»' + (NET.lanIps.length ? ', адрес ' + NET.lanIps[0] : ''), 'good');
  } else toast('Остров открыт' + (tr === 'net' ? ' через интернет' : ' для друзей') + '. Код: ' + code.toUpperCase() + '. Он же в меню (☰)', 'good');

function netMatesTick(dt){

    if (!m.playing) continue;
    if (dist(m.rx, m.ry, m.x, m.y) > 220){ m.rx = m.x; m.ry = m.y; } else { m.rx += (m.x - m.rx)*k; m.ry += (m.y - m.ry)*k; }

    // gulls over the airfield
    c.strokeStyle = 'rgba(40,40,40,.7)'; c.lineWidth = 1.2;
    for (const gu of gulls){ const x = wx(gu.x + gu.sp*t), y = g - gu.h*S, f = Math.sin(t*7 + gu.ph)*3*S; if (x < -20 || x > W + 20) continue; c.beginPath(); c.moveTo(x - 6*S, y + f); c.quadraticCurveTo(x - 3*S, y - 2*S, x, y); c.quadraticCurveTo(x + 3*S, y - 2*S, x + 6*S, y + f); c.stroke(); }
    // the plane's shadow on the ground or the water
    if (!crashed){ const px = wx(P.x); c.fillStyle = `rgba(10,30,40,${clamp(0.3 - P.h/700, 0.04, 0.3).toFixed(2)})`; c.beginPath(); c.ellipse(px - P.h*0.25*S, g + 7*S + P.h*0.05*S, 48*S*(1 + P.h/600), 4*S, 0, 0, TAU); c.fill(); }
    // smoke, fire, dust and debris
    for (const o of parts){
      const x = wx(o.x), y = g + 6*S - o.y*S, k = clamp(o.life/o.max, 0, 1), grow = (o.kind === 'debris' || o.kind === 'spray' || o.kind === 'prop') ? 1 : 1 + (1 - k)*2.4, r = o.size*S*grow;
      if (x < -120 || x > W + 120) continue;
      if (o.kind === 'smoke') blob(x, y, r*1.3, 155, 155, 155, k*0.45);
      else if (o.kind === 'black' || o.kind === 'column') blob(x, y, r*1.4, 42, 38, 36, k*(o.kind === 'column' ? 0.62 : 0.7));
      else if (o.kind === 'dustcloud') blob(x, y, r*1.5, 205, 182, 136, k*0.55);
      else if (o.kind === 'fire' || o.kind === 'blast'){ if (k > 0.5) blob(x, y, r*1.25, 255, Math.round(150 + 90*(k - 0.5)*2), 70, k*0.95); else blob(x, y, r*1.25, Math.round(120 + 240*k), Math.round(60 + 110*k), 40, k*0.85); }
      else if (o.kind === 'spray'){ c.fillStyle = `rgba(214,190,140,${k.toFixed(3)})`; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
      else if (o.kind === 'debris'){ c.save(); c.translate(x, y); c.rotate(o.rot); c.fillStyle = o.col; c.fillRect(-r, -r*0.35, r*2, r*0.7); c.restore(); }
      else if (o.kind === 'prop'){ c.save(); c.translate(x, y); c.rotate(o.rot); c.scale(S, S); drawProp(); c.restore(); }
    }
    // the plane, or its wreck nosed into the sand
    { const px = wx(P.x + (crashed ? wreck.dx : 0)), py = g + 6*S - (P.h - (crashed ? 7 : 0))*S - 23*S*0.95;
      c.save();
      if (crashed){ c.beginPath(); c.rect(-30, -30, W + 60, g + 8*S + 30); c.clip(); }
      c.translate(px, py); c.rotate(crashed ? wreck.a : P.a); c.scale(S*0.95, S*0.95);
      drawPlaneSide(crashed ? -1 : P.prop, t > T_FAIL, t, crashed ? 0 : (t < TI ? 260 : 0));
      if (crashed){ c.fillStyle = 'rgba(25,18,12,.45)'; c.beginPath(); c.ellipse(46, 2, 18, 9, 0, 0, TAU); c.fill(); }
      c.restore();
      if (crashed){ c.fillStyle = 'rgba(110,85,50,.55)'; c.beginPath(); c.ellipse(px - 30*S, g + 8*S, 46*S, 3.5*S, 0, 0, TAU); c.fill(); }
    }
    c.restore();
    // lens flare from the sun, film grain, warm grade, vignette, flash
    if (!lowQ){ const cx = W/2, cy = TB + sh/2, dx = cx - sunX, dy = cy - sunY;
      for (const [f, r, col] of [[0.35, 14, '255,230,180,.10'], [0.6, 26, '180,220,255,.06'], [0.85, 10, '255,200,150,.12'], [1.3, 40, '200,230,255,.05']]){ c.fillStyle = `rgba(${col})`; c.beginPath(); c.arc(sunX + dx*f, sunY + dy*f, r*S + 4, 0, TAU); c.fill(); } }
    if (flash > 0){ c.fillStyle = `rgba(255,236,200,${flash.toFixed(3)})`; c.fillRect(0, 0, W, H); }
    const vg = c.createRadialGradient(W/2, TB + sh/2, Math.min(W, sh)*0.4, W/2, TB + sh/2, Math.max(W, sh)*0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,6,0,.5)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,190,120,.05)'; c.fillRect(0, 0, W, H);
    if (!lowQ){ c.save(); c.globalAlpha = 0.55; c.translate((Math.random()*160) | 0, (Math.random()*160) | 0); c.fillStyle = grainPat; c.fillRect(-160, -160, W + 320, H + 320); c.restore(); }
    // letterbox bars slide in at the start
    const lb = clamp((t - tStart)/0.6, 0, 1);
    c.fillStyle = '#000'; c.fillRect(0, 0, W, TB*lb); c.fillRect(0, H - BB*lb, W, BB*lb + 1);
  };

  const step = now => {
    if (!introOn) return;
    if (first){ first = false; t0 = now - tStart*1000; lastNow = now; }
    // a stalled frame (a busy phone while the page loads) pauses the film instead of skipping part of it
    if (now - lastNow > 100) t0 += now - lastNow - 100;
    const dt = Math.min(0.1, (now - lastNow)/1000); lastNow = now;
    if (!lowQ && dt > 0.04){ if (++slowN > 8) lowQ = true; } else if (dt < 0.03) slowN = Math.max(0, slowN - 1);
    const t = (now - t0)/1000;
    const P = at(Math.min(t, TI));
    if (snd && !crashed) engineSet(t < T_FAIL ? 0.15 + Math.min(1, t/1.7)*0.75 : Math.max(0, P.prop*0.7));
    const eng = (dx, dy) => { const ca = Math.cos(P.a), sa = Math.sin(P.a); return [P.x + (dx*ca - dy*sa)*0.95, P.h + 23*0.95 - 6 - (dx*sa + dy*ca)*0.95]; };
    if (t > T_FAIL && coughs < 3 && t > T_FAIL + coughs*0.45){ coughs++; const [ex, ey] = eng(50, 0); puff(ex, ey, 'black', 9); if (snd) sfx('cough'); }
    if (t > T_FAIL && !crashed){
      emitT -= dt; if (emitT <= 0){ emitT = 0.04; const [ex, ey] = eng(46, -2); puff(ex, ey, t > T_FAIL + 1 ? 'black' : 'smoke', 1); }
      if (t > T_FAIL + 1.1){ fireT -= dt; if (fireT <= 0){ fireT = 0.03; const [ex, ey] = eng(50, 0); puff(ex, ey, 'fire', 1); } }
      if (snd && t > T_FAIL + 1.3 && AU.engine) engineStop();
    }
    if (!crashed && t >= TI){
      crashed = true; crashT = 0; wreck.a = last.a; flash = calm ? 0.2 : 0.55; shake = 14*S;
      puff(last.x + 40, 4, 'blast', 14); puff(last.x + 30, 2, 'dustcloud', 22); puff(last.x + 30, 2, 'spray', 46); puff(last.x + 20, 6, 'debris', 16); puff(last.x + 52, 10, 'prop', 1);
      if (snd){ sfx('boom'); sfx('thunder'); }
      try { if (navigator.vibrate) navigator.vibrate([60, 40, 120]); } catch (e) {}
    }
    if (crashed){
      crashT += dt;
      wreck.dx = 46*(1 - Math.exp(-crashT*4)); wreck.a = last.a + (0.42 - last.a)*(1 - Math.exp(-crashT*5));
      if (crashT < 0.5){ puff(last.x + wreck.dx + 40, 1, 'spray', 2); }
      emitT -= dt; if (emitT <= 0){ emitT = 0.06; puff(last.x + wreck.dx + 34 + Math.random()*14, 10, 'column', 1); if (Math.random() < 0.7) puff(last.x + wreck.dx + 44, 8, 'fire', 1); }
    }
    flash = Math.max(0, flash - dt*1.4); shake = Math.max(0, shake - dt*26*S);
    for (const o of parts){
      o.life -= dt; o.x += o.vx*dt; o.y += o.vy*dt; o.rot += o.vr*dt;
      if (o.g){ o.vy -= o.g*dt; if (o.y < 0){ o.y = 0; o.vy *= -0.2; o.vx *= 0.5; o.vr *= 0.4; } }
      else { o.vx *= 1 - dt*0.35; o.vx -= dt*6; }               // the breeze carries smoke and dust to the left
    }
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
    const k = clamp((t - tStart)/(TI - tStart), 0, 1), pct = crashed ? 100 : Math.floor(Math.pow(k, 0.85)*99);
    barEl.style.width = pct + '%'; pctEl.textContent = pct + '%';
    const st = t < 0.6 ? 'Прогрев двигателя' : t < 1.7 ? 'Разбег' : t < 2.5 ? 'Взлёт' : t < T_FAIL ? 'Набор высоты' : t < T_FAIL + 1.1 ? 'Отказ двигателя!' : !crashed ? 'Аварийная посадка' : 'Крушение. Остров загружен';
    if (stageEl.textContent !== st){ stageEl.textContent = st; stageEl.classList.toggle('bad', t >= T_FAIL && !crashed); }
    if (t < T_FAIL + 0.2) capEl.style.opacity = shortCut ? 0 : t < 0.6 ? Math.max(0, (t - 0.3)/0.3) : t < 2.6 ? 1 : Math.max(0, 1 - (t - 2.6)/0.6);
    else { if (capEl.dataset.p !== '2'){ capEl.dataset.p = '2'; capEl.textContent = 'Высота 600 м · 40 км до берега · отказ двигателя'; } capEl.style.opacity = t < T_FAIL + 2.4 ? 1 : Math.max(0, 1 - (t - T_FAIL - 2.4)/0.5); }
    try { draw(t, dt); } catch (e) { console.error(e); finish(true); return; }
    if (t >= END) finish(false);
    if (!done || wrap.parentNode) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
startIntro();
requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
